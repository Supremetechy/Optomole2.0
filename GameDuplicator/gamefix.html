    <script>
       // Enhanced Shooter Game Implementation
        function initializeShooterPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                score: 0,
                lives: 3,
                level: 1,
                player: {
                    x: canvas.width / 2 - 15,
                    y: canvas.height - 50,
                    width: 30,
                    height: 20,
                    speed: 6
                // Fix missing functions and add proper error handling
        function isValidPosition(piece, dx = 0, dy = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + dx;
                        const newY = piece.y + y + dy;
                        if (newX < 0 || newX >= gameState.boardWidth || newY >= gameState.boardHeight || 
                           (newY >= 0 && gameState.board[newY][newX])) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function rotatePiece(piece) {
            // Rotate 90 degrees clockwise using the optimized matrix rotation
            const rotated = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );
            
            // Try to place rotated piece, with wall kicks
            const kicks = [
                [0, 0],   // No offset
                [-1, 0],  // Left
                [1, 0],   // Right
                [0, -1],  // Up
                [-1, -1], // Up-left
                [1, -1]   // Up-right
            ];
            
            for (let [dx, dy] of kicks) {
                if (isValidPosition({ ...piece, shape: rotated }, dx, dy)) {
                    piece.shape = rotated;
                    piece.x += dx;
                    piece.y += dy;
                    return true;
                }
            }
            return false;
        }

        function placePiece() {
            for (let y = 0; y < gameState.currentPiece.shape.length; y++) {
                for (let x = 0; x < gameState.currentPiece.shape[y].length; x++) {
                    if (gameState.currentPiece.shape[y][x]) {
                        const boardY = gameState.currentPiece.y + y;
                        const boardX = gameState.currentPiece.x + x;
                        if (boardY >= 0) {
                            gameState.board[boardY][boardX] = gameState.currentPiece.color;
                        }
                    }
                }
            }
            clearLines();
            gameState.currentPiece = gameState.nextPiece;
            gameState.nextPiece = createPiece();
            
            if (!isValidPosition(gameState.currentPiece)) {
                gameOver();
            }
        }

        function drawTetrisGame() {
            if (!gameState.running) return;

            // Background
            ctx.fillStyle = '#0b1220';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / gameState.boardWidth;
            const cellH = canvas.height / gameState.boardHeight;

            // Draw board grid and cells
            for (let r = 0; r < gameState.boardHeight; r++) {
                for (let c = 0; c < gameState.boardWidth; c++) {
                    const cell = gameState.board[r][c];
                    if (cell) {
                        ctx.fillStyle = cell;
                        ctx.fillRect(c * cellW, r * cellH, cellW - 1, cellH - 1);
                        
                        // Add highlight for 3D effect
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(c * cellW, r * cellH, cellW - 1, 2);
                    } else {
                        ctx.strokeStyle = '#111827';
                        ctx.strokeRect(c * cellW, r * cellH, cellW, cellH);
                    }
                }
            }

            // Draw ghost piece (preview of where current piece will land)
            if (gameState.currentPiece) {
                const ghostPiece = { ...gameState.currentPiece };
                while (isValidPosition(ghostPiece, 0, 1)) {
                    ghostPiece.y++;
                }
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                for (let r = 0; r < ghostPiece.shape.length; r++) {
                    for (let c = 0; c < ghostPiece.shape[r].length; c++) {
                        if (ghostPiece.shape[r][c]) {
                            const bx = ghostPiece.x + c;
                            const by = ghostPiece.y + r;
                            if (by >= 0) {
                                ctx.fillRect(bx * cellW, by * cellH, cellW - 1, cellH - 1);
                            }
                        }
                    }
                }
            }

            // Draw current piece
            if (gameState.currentPiece) {
                const p = gameState.currentPiece;
                ctx.fillStyle = p.color;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            const bx = p.x + c;
                            const by = p.y + r;
                            if (by >= 0) {
                                ctx.fillRect(bx * cellW, by * cellH, cellW - 1, cellH - 1);
                                
                                // Add highlight
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                                ctx.fillRect(bx * cellW, by * cellH, cellW - 1, 2);
                                ctx.fillStyle = p.color;
                            }
                        }
                    }
                }
            }

            // Draw next piece preview
            if (gameState.nextPiece) {
                const previewX = canvas.width - 80;
                const previewY = 20;
                const previewSize = 12;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(previewX - 5, previewY - 5, 70, 60);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '10px Arial';
                ctx.fillText('NEXT', previewX, previewY - 8);
                
                ctx.fillStyle = gameState.nextPiece.color;
                for (let r = 0; r < gameState.nextPiece.shape.length; r++) {
                    for (let c = 0; c < gameState.nextPiece.shape[r].length; c++) {
                        if (gameState.nextPiece.shape[r][c]) {
                            ctx.fillRect(
                                previewX + c * previewSize,
                                previewY + r * previewSize,
                                previewSize - 1,
                                previewSize - 1
                            );
                        }
                    }
                }
            }

            // HUD
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`Score: ${gameState.score}`, 8, 16);
            ctx.fillText(`Lines: ${gameState.lines}`, 8, 32);
            ctx.fillText(`Level: ${gameState.level}`, 8, 48);

            // Show pause overlay
            if (gameState.paused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }
        },
                bullets: [],
                enemies: [],
                enemyBullets: [],
                powerUps: [],
                particles: [],
                stars: [],
                enemySpawnTimer: 0,
                enemySpawnRate: 90,
                bulletSpeed: 8,
                enemySpeed: 2,
                keys: {},
                lastShotTime: 0,
                shotCooldown: 150
            };

            gamePreviewStates[gameId] = gameState;

            // Create star field
            for (let i = 0; i < 50; i++) {
                gameState.stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 3 + 1,
                    size: Math.random() * 2 + 1
                });
            }

            function createEnemy() {
                return {
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 25,
                    height: 20,
                    speed: gameState.enemySpeed + Math.random() * 1.5,
                    health: 1,
                    shootTimer: Math.floor(Math.random() * 120) + 60,
                    type: Math.random() > 0.9 ? 'fast' : 'normal'
                };
            }

            function createBullet(x, y, velocityY, isPlayerBullet = true) {
                return {
                    x: x,
                    y: y,
                    width: 4,
                    height: isPlayerBullet ? 8 : 6,
                    velocityY: velocityY,
                    isPlayerBullet: isPlayerBullet
                };
            }

            function createPowerUp(x, y) {
                const types = ['speed', 'multishot', 'shield', 'rapidfire'];
                return {
                    x: x,
                    y: y,
                    width: 15,
                    height: 15,
                    type: types[Math.floor(Math.random() * types.length)],
                    velocityY: 2,
                    life: 300
                };
            }

            function createParticle(x, y, color, count = 5) {
                for (let i = 0; i < count; i++) {
                    gameState.particles.push({
                        x: x,
                        y: y,
                        velocityX: (Math.random() - 0.5) * 10,
                        velocityY: (Math.random() - 0.5) * 10,
                        life: 20 + Math.random() * 20,
                        maxLife: 40,
                        color: color,
                        size: Math.random() * 3 + 1
                    }

                    // Power-up collection
                    for (let i = gameState.powerUps.length - 1; i >= 0; i--) {
                        const powerUp = gameState.powerUps[i];
                        
                        if (powerUp.x < gameState.player.x + gameState.player.width &&
                            powerUp.x + powerUp.width > gameState.player.x &&
                            powerUp.y < gameState.player.y + gameState.player.height &&
                            powerUp.y + powerUp.height > gameState.player.y) {
                            
                            gameState.powerUps.splice(i, 1);
                            gameState.score += 50;
                            playSound('score');
                            
                            // Apply power-up effect
                            switch (powerUp.type) {
                                case 'speed':
                                    gameState.player.speed = Math.min(10, gameState.player.speed + 1);
                                    showNotification('Speed Boost!', 'success');
                                    break;
                                case 'multishot':
                                    showNotification('Multi-shot!', 'success');
                                    break;
                                case 'shield':
                                    gameState.lives = Math.min(5, gameState.lives + 1);
                                    showNotification('Extra Life!', 'success');
                                    break;
                                case 'rapidfire':
                                    gameState.shotCooldown = Math.max(50, gameState.shotCooldown - 20);
                                    showNotification('Rapid Fire!', 'success');
                                    break;
                            }
                        }
                    }

                    // Level progression
                    if (gameState.score > gameState.level * 1000) {
                        gameState.level++;
                        gameState.enemySpeed += 0.3;
                        showNotification(`Level ${gameState.level}!`, 'info');
                        playSound('lineClear');
                    }

                    // Update score display
                    if (scoreDisplay) {
                        scoreDisplay.textContent = `Score: ${gameState.score} | Lives: ${gameState.lives} | Level: ${gameState.level}`;
                    }
                }

                drawShooterGame();
                gameState.animationId = requestAnimationFrame(updateShooterGame);
            }

            function gameOver() {
                gameState.running = false;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText(`Final Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText(`Level Reached: ${gameState.level}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.font = '14px Arial';
                ctx.fillText('Click Stop and Play again to restart', canvas.width / 2, canvas.height / 2 + 70);
                ctx.textAlign = 'left';
            }

            // Enhanced keyboard handling
            window.currentGameKeyHandler = (e) => {
                if (!gameState.running) return;
                
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'a', 'd', 'w', 's'].includes(e.key)) {
                    e.preventDefault();
                }

                gameState.keys[e.key] = true;

                // Manual shooting for single shots
                if (e.key === ' ' && !gameState.paused && Date.now() - gameState.lastShotTime > gameState.shotCooldown) {
                    gameState.bullets.push(createBullet(
                        gameState.player.x + gameState.player.width/2 - 2, 
                        gameState.player.y, 
                        -gameState.bulletSpeed, 
                        true
                    ));
                    gameState.lastShotTime = Date.now();
                    playSound('move');
                }
            };

            const keyUpHandler = (e) => {
                gameState.keys[e.key] = false;
            };

            document.addEventListener('keydown', window.currentGameKeyHandler);
            document.addEventListener('keyup', keyUpHandler);
            
            gameState.keyUpHandler = keyUpHandler;

            if (scoreDisplay) {
                scoreDisplay.textContent = `Score: 0 | Lives: 3 | Level: 1`;
            }

            drawShooterGame();
            updateShooterGame();
        }

        // Enhanced Chess Preview (Simple Version)
        function initializeChessPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                message: "Chess demo - Click pieces to see moves",
                board: createSimpleChessBoard(),
                selectedSquare: null,
                currentPlayer: 'white',
                squareSize: Math.min(canvas.width, canvas.height) / 8
            };

            gamePreviewStates[gameId] = gameState;

            function createSimpleChessBoard() {
                const board = Array(8).fill(null).map(() => Array(8).fill(null));
                
                // Simple piece setup
                const pieces = {
                    'white': { king: '♔', queen: '♕', rook: '♖', bishop: '♗', knight: '♘', pawn: '♙' },
                    'black': { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
                };
                
                // Place some pieces for demo
                board[0] = [
                    {type: 'rook', color: 'black', symbol: pieces.black.rook},
                    {type: 'knight', color: 'black', symbol: pieces.black.knight},
                    {type: 'bishop', color: 'black', symbol: pieces.black.bishop},
                    {type: 'queen', color: 'black', symbol: pieces.black.queen},
                    {type: 'king', color: 'black', symbol: pieces.black.king},
                    {type: 'bishop', color: 'black', symbol: pieces.black.bishop},
                    {type: 'knight', color: 'black', symbol: pieces.black.knight},
                    {type: 'rook', color: 'black', symbol: pieces.black.rook}
                ];
                
                // Black pawns
                for (let i = 0; i < 8; i++) {
                    board[1][i] = {type: 'pawn', color: 'black', symbol: pieces.black.pawn};
                }
                
                // White pawns
                for (let i = 0; i < 8; i++) {
                    board[6][i] = {type: 'pawn', color: 'white', symbol: pieces.white.pawn};
                }
                
                // White pieces
                board[7] = [
                    {type: 'rook', color: 'white', symbol: pieces.white.rook},
                    {type: 'knight', color: 'white', symbol: pieces.white.knight},
                    {type: 'bishop', color: 'white', symbol: pieces.white.bishop},
                    {type: 'queen', color: 'white', symbol: pieces.white.queen},
                    {type: 'king', color: 'white', symbol: pieces.white.king},
                    {type: 'bishop', color: 'white', symbol: pieces.white.bishop},
                    {type: 'knight', color: 'white', symbol: pieces.white.knight},
                    {type: 'rook', color: 'white', symbol: pieces.white.rook}
                ];
                
                return board;
            }

            function drawChessGame() {
                if (!gameState.running) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw chessboard
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const isLight = (row + col) % 2 === 0;
                        ctx.fillStyle = isLight ? '#F0D9B5' : '#B58863';
                        
                        if (gameState.selectedSquare && 
                            gameState.selectedSquare.row === row && 
                            gameState.selectedSquare.col === col) {
                            ctx.fillStyle = '#FFD700';
                        }
                        
                        ctx.fillRect(col * gameState.squareSize, row * gameState.squareSize, 
                                   gameState.squareSize, gameState.squareSize);
                        
                        // Draw piece
                        const piece = gameState.board[row][col];
                        if (piece) {
                            ctx.font = `${gameState.squareSize * 0.7}px serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = '#000000';
                            ctx.fillText(piece.symbol, 
                                       col * gameState.squareSize + gameState.squareSize/2,
                                       row * gameState.squareSize + gameState.squareSize/2);
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'alphabetic';
                        }
                    }
                }
                
                // Draw current player indicator
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
                ctx.fillStyle = '#000000';
                ctx.font = '16px Arial';
                ctx.fillText(`${gameState.currentPlayer.toUpperCase()}'s turn - ${gameState.message}`, 10, canvas.height - 10);
            }

            function handleChessClick(event) {
                if (!gameState.running || gameState.paused) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                const col = Math.floor(x / gameState.squareSize);
                const row = Math.floor(y / gameState.squareSize);
                
                if (row < 0 || row >= 8 || col < 0 || col >= 8) return;
                
                const piece = gameState.board[row][col];
                
                if (gameState.selectedSquare) {
                    // Try to move
                    if (gameState.selectedSquare.row !== row || gameState.selectedSquare.col !== col) {
                        const selectedPiece = gameState.board[gameState.selectedSquare.row][gameState.selectedSquare.col];
                        if (selectedPiece && selectedPiece.color === gameState.currentPlayer) {
                            // Simple move (no validation for demo)
                            gameState.board[row][col] = selectedPiece;
                            gameState.board[gameState.selectedSquare.row][gameState.selectedSquare.col] = null;
                            gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
                            gameState.message = "Move made!";
                            playSound('move');
                        }
                    }
                    gameState.selectedSquare = null;
                } else if (piece && piece.color === gameState.currentPlayer) {
                    // Select piece
                    gameState.selectedSquare = { row, col };
                    gameState.message = `Selected ${piece.type}`;
                    playSound('move');
                }
                
                drawChessGame();
            }

            canvas.addEventListener('click', handleChessClick);
            gameState.clickHandler = handleChessClick;

            window.currentGameKeyHandler = (e) => {
                // Chess doesn't use keyboard input in this demo

        function initializeSnakePreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                score: 0,
                snake: [{ x: 10, y: 10 }],
                direction: { x: 1, y: 0 },
                nextDirection: { x: 1, y: 0 }, // Add next direction buffer
                food: { x: 15, y: 15 },
                gridSize: 20,
                gameSpeed: 200,
                cols: Math.floor(canvas.width / 20),
                rows: Math.floor(canvas.height / 20),
                lastMoveTime: 0
            };

            // Ensure food doesn't spawn on snake
            function spawnFood() {
                let attempts = 0;
                do {
                    gameState.food = {
                        x: Math.floor(Math.random() * gameState.cols),
                        y: Math.floor(Math.random() * gameState.rows)
                    };
                    attempts++;
                } while (attempts < 100 && gameState.snake.some(segment => 
                    segment.x === gameState.food.x && segment.y === gameState.food.y));
            }

            spawnFood(); // Initial food spawn
            gamePreviewStates[gameId] = gameState;

            function drawSnakeGame() {
                if (!gameState.running) return;

                // Clear canvas with background
                ctx.fillStyle = '#1F2937';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw grid lines (subtle)
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= canvas.width; x += gameState.gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += gameState.gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                // Draw snake with gradient effect
                gameState.snake.forEach((segment, index) => {
                    const intensity = 1 - (index / gameState.snake.length) * 0.5;
                    ctx.fillStyle = index === 0 ? '#10B981' : `rgba(16, 185, 129, ${intensity})`;
                    ctx.fillRect(
                        segment.x * gameState.gridSize + 1, 
                        segment.y * gameState.gridSize + 1, 
                        gameState.gridSize - 2, 
                        gameState.gridSize - 2
                    );
                    
                    // Draw eyes on head
                    if (index === 0) {
                        ctx.fillStyle = '#FFFFFF';
                        const eyeSize = 3;
                        const eyeOffset = 4;
                        if (gameState.direction.x !== 0) {
                            ctx.fillRect(segment.x * gameState.gridSize + eyeOffset, segment.y * gameState.gridSize + 4, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gameState.gridSize + eyeOffset, segment.y * gameState.gridSize + 12, eyeSize, eyeSize);
                        } else {
                            ctx.fillRect(segment.x * gameState.gridSize + 4, segment.y * gameState.gridSize + eyeOffset, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gameState.gridSize + 12, segment.y * gameState.gridSize + eyeOffset, eyeSize, eyeSize);
                        }
                    }
                });

                // Draw food with pulsing effect
                const pulseSize = Math.sin(Date.now() * 0.01) * 2 + gameState.gridSize - 4;
                ctx.fillStyle = '#EF4444';
                ctx.fillRect(
                    gameState.food.x * gameState.gridSize + (gameState.gridSize - pulseSize) / 2, 
                    gameState.food.y * gameState.gridSize + (gameState.gridSize - pulseSize) / 2, 
                    pulseSize, 
                    pulseSize
                );

                // Draw border
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                // Show pause overlay
                if (gameState.paused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'left';
                }
            }

            function updateSnakeGame() {
                if (!gameState.running) return;

                const currentTime = Date.now();
                if (currentTime - gameState.lastMoveTime < gameState.gameSpeed) {
                    drawSnakeGame();
                    gameState.animationId = requestAnimationFrame(updateSnakeGame);
                    return;
                }

                if (gameState.paused) {
                    drawSnakeGame();
                    gameState.animationId = requestAnimationFrame(updateSnakeGame);
                    return;
                }

                gameState.lastMoveTime = currentTime;

                // Update direction from buffer
                gameState.direction = { ...gameState.nextDirection };

                // Move snake
                const head = { 
                    x: gameState.snake[0].x + gameState.direction.x, 
                    y: gameState.snake[0].y + gameState.direction.y 
                };

                // Check walls
                if (head.x < 0 || head.x >= gameState.cols || 
                    head.y < 0 || head.y >= gameState.rows) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (gameState.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    gameOver();
                    return;
                }

                gameState.snake.unshift(head);

                // Check food collision
                if (head.x === gameState.food.x && head.y === gameState.food.y) {
                    gameState.score += 10;
                    if (scoreDisplay) {
                        scoreDisplay.textContent = `Score: ${gameState.score} | Length: ${gameState.snake.length}`;
                    }
                    spawnFood();
                    
                    // Increase speed slightly
                    gameState.gameSpeed = Math.max(100, gameState.gameSpeed - 2);
                    
                    playSound('score');
                } else {
                    gameState.snake.pop();
                }

                drawSnakeGame();
                gameState.animationId = requestAnimationFrame(updateSnakeGame);
            }

            function gameOver() {
                gameState.running = false;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText(`Final Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText(`Snake Length: ${gameState.snake.length}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.font = '14px Arial';
                ctx.fillText('Click Stop and Play again to restart', canvas.width / 2, canvas.height / 2 + 70);
                ctx.textAlign = 'left';
                playSound('gameOver');
            }

            // Enhanced keyboard handling with direction buffering
            window.currentGameKeyHandler = (e) => {
                if (!gameState.running) return;
                
                // Prevent default to stop page scrolling
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                }

                if (gameState.paused) return;

                const currentDir = gameState.direction;
                switch(e.key) {
                    case 'ArrowUp': 
                        if (currentDir.y === 0) gameState.nextDirection = { x: 0, y: -1 }; 
                        break;
                    case 'ArrowDown': 
                        if (currentDir.y === 0) gameState.nextDirection = { x: 0, y: 1 }; 
                        break;
                    case 'ArrowLeft': 
                        if (currentDir.x === 0) gameState.nextDirection = { x: -1, y: 0 }; 
                        break;
                    case 'ArrowRight': 
                        if (currentDir.x === 0) gameState.nextDirection = { x: 1, y: 0 }; 
                        break;
                }
                playSound('move');
            };

            document.addEventListener('keydown', window.currentGameKeyHandler);
            
            // Initialize score display
            if (scoreDisplay) {
                scoreDisplay.textContent = `Score: 0 | Length: 1`;
            }
            
            drawSnakeGame();
            updateSnakeGame();
        }

            function isValidPosition(piece, dx = 0, dy = 0) {
                for (let y = 0; y < piece.shape.length; y++) {
                    for (let x = 0; x < piece.shape[y].length; x++) {
                        if (piece.shape[y][x]) {
                            const newX = piece.x + x + dx;
                            const newY = piece.y + y + dy;
                            if (newX < 0 || newX >= gameState.boardWidth || newY >= gameState.boardHeight || 
                               (newY >= 0 && gameState.board[newY][newX])) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }

            function placePiece() {
                for (let y = 0; y < gameState.currentPiece.shape.length; y++) {
                    for (let x = 0; x < gameState.currentPiece.shape[y].length; x++) {
                        if (gameState.currentPiece.shape[y][x]) {
                            gameState.board[gameState.currentPiece.y + y][gameState.currentPiece.x + x] = gameState.currentPiece.color;
                        }
                    }
                }
                clearLines();
                gameState.currentPiece = createPiece();
                if (!isValidPosition(gameState.currentPiece)) {

                    }

        // Pacman Preview Game Implementation
        function initializePacmanPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                score: 0,
                lives: 3,
                cellSize: 15,
                cols: Math.floor(canvas.width / 15),
                rows: Math.floor(canvas.height / 15),
                player: { x: 1, y: 1, direction: { x: 0, y: 0 }, nextDirection: { x: 0, y: 0 } },
                ghosts: [],
                maze: [],
                dots: [],
                powerPellets: [],
                powerMode: false,
                powerModeTimer: 0
            };

            gamePreviewStates[gameId] = gameState;

            // Create simple maze
            gameState.maze = Array(gameState.rows).fill().map(() => Array(gameState.cols).fill(0));
            for (let y = 0; y < gameState.rows; y++) {
                for (let x = 0; x < gameState.cols; x++) {
                    if (x === 0 || x === gameState.cols - 1 || y === 0 || y === gameState.rows - 1) {
                        gameState.maze[y][x] = 1;
                    } else if (x % 4 === 0 && y % 4 === 0 && Math.random() > 0.7) {
                        gameState.maze[y][x] = 1;
                    }
                }
            }

            // Create dots
            for (let y = 1; y < gameState.rows - 1; y++) {
                for (let x = 1; x < gameState.cols - 1; x++) {
                    if (gameState.maze[y][x] === 0 && !(x === 1 && y === 1)) {
                        if (Math.random() > 0.3) {
                            gameState.dots.push({ x, y });
                        }
                    }
                }
            }

            // Create ghosts
            const centerX = Math.floor(gameState.cols / 2);
            const centerY = Math.floor(gameState.rows / 2);
            gameState.ghosts = [
                { x: centerX, y: centerY, direction: { x: 1, y: 0 }, color: '#FF0000' },
                { x: centerX + 1, y: centerY, direction: { x: -1, y: 0 }, color: '#FFB6FF' }
            ];

            function canMoveTo(x, y) {
                return x >= 0 && x < gameState.cols && y >= 0 && y < gameState.rows && gameState.maze[y][x] === 0;
            }

            function drawPacmanGame() {
                if (!gameState.running) return;

                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw maze
                ctx.fillStyle = '#0000FF';
                for (let y = 0; y < gameState.rows; y++) {
                    for (let x = 0; x < gameState.cols; x++) {
                        if (gameState.maze[y][x] === 1) {
                            ctx.fillRect(x * gameState.cellSize, y * gameState.cellSize, gameState.cellSize, gameState.cellSize);
                        }
                    }
                }

                // Draw dots
                ctx.fillStyle = '#FFFF00';
                gameState.dots.forEach(dot => {
                    ctx.beginPath();
                    ctx.arc(
                        dot.x * gameState.cellSize + gameState.cellSize/2,
                        dot.y * gameState.cellSize + gameState.cellSize/2,
                        2, 0, Math.PI * 2
                    );
                    ctx.fill();
                });

                // Draw player
                ctx.fillStyle = '#FFFF00';
                ctx.beginPath();
                ctx.arc(
                    gameState.player.x * gameState.cellSize + gameState.cellSize/2,
                    gameState.player.y * gameState.cellSize + gameState.cellSize/2,
                    gameState.cellSize/2 - 2, 0, Math.PI * 2
                );
                ctx.fill();

                // Draw ghosts
                gameState.ghosts.forEach(ghost => {
                    ctx.fillStyle = gameState.powerMode ? '#0000FF' : ghost.color;
                    ctx.fillRect(
                        ghost.x * gameState.cellSize + 2,
                        ghost.y * gameState.cellSize + 2,
                        gameState.cellSize - 4,
                        gameState.cellSize - 4
                    );
                });
            }

            function updatePacmanGame() {
                if (!gameState.running || gameState.paused) return;

                // Update player
                if (canMoveTo(gameState.player.x + gameState.player.nextDirection.x, gameState.player.y + gameState.player.nextDirection.y)) {
                    gameState.player.direction = { ...gameState.player.nextDirection };
                }

                if (canMoveTo(gameState.player.x + gameState.player.direction.x, gameState.player.y + gameState.player.direction.y)) {
                    gameState.player.x += gameState.player.direction.x;
                    gameState.player.y += gameState.player.direction.y;
                }

                // Check dot collection
                const dotIndex = gameState.dots.findIndex(dot => dot.x === gameState.player.x && dot.y === gameState.player.y);
                if (dotIndex !== -1) {
                    gameState.dots.splice(dotIndex, 1);
                    gameState.score += 10;
                    scoreDisplay.textContent = `Score: ${gameState.score} | Lives: ${gameState.lives}`;
                    playSound('score');
                }

                // Update ghosts
                gameState.ghosts.forEach(ghost => {
                    if (Math.random() < 0.1) {
                        const directions = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }];
                        const validDirections = directions.filter(dir => canMoveTo(ghost.x + dir.x, ghost.y + dir.y));
                        if (validDirections.length > 0) {
                            ghost.direction = validDirections[Math.floor(Math.random() * validDirections.length)];
                        }
                    }

                    if (canMoveTo(ghost.x + ghost.direction.x, ghost.y + ghost.direction.y)) {
                        ghost.x += ghost.direction.x;
                        ghost.y += ghost.direction.y;
                    }
                });

                // Check ghost collisions
                gameState.ghosts.forEach(ghost => {
                    if (ghost.x === gameState.player.x && ghost.y === gameState.player.y) {
                        if (gameState.powerMode) {
                            gameState.score += 200;
                            ghost.x = Math.floor(gameState.cols/2);
                            ghost.y = Math.floor(gameState.rows/2);
                        } else {
                            gameState.lives--;
                            gameState.player.x = 1;
                            gameState.player.y = 1;
                            if (gameState.lives <= 0) {
                                gameOver();
                                return;
                            }
                        }
                    }
                });

                // Win condition
                if (gameState.dots.length === 0) {
                    gameState.score += 1000;
                    scoreDisplay.textContent = `Score: ${gameState.score} | LEVEL COMPLETE!`;
                    setTimeout(() => gameOver(), 2000);
                }

                drawPacmanGame();
                gameState.intervalId = setTimeout(updatePacmanGame, 200);
            }

            function gameOver() {
                gameState.running = false;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(gameState.lives <= 0 ? 'Game Over!' : 'Level Complete!', canvas.width / 2, canvas.height / 2);
                ctx.fillText(`Final Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }

            window.currentGameKeyHandler = (e) => {
                if (!gameState.running || gameState.paused) return;
                switch(e.key) {
                    case 'ArrowUp': gameState.player.nextDirection = { x: 0, y: -1 }; break;
                    case 'ArrowDown': gameState.player.nextDirection = { x: 0, y: 1 }; break;
                    case 'ArrowLeft': gameState.player.nextDirection = { x: -1, y: 0 }; break;
                    case 'ArrowRight': gameState.player.nextDirection = { x: 1, y: 0 }; break;
                }
                playSound('move');
            };

            document.addEventListener('keydown', window.currentGameKeyHandler);
            drawPacmanGame();
            updatePacmanGame();
        }

                ctx.fillStyle = '#3B82F6';
                ctx.fillRect(gameState.player.x, gameState.player.y, gameState.player.width, gameState.player.height);

                // Draw particles
                ctx.fillStyle = '#FBBF24';
                gameState.particles.forEach(particle => {
                    ctx.globalAlpha = particle.life / particle.maxLife;
                    ctx.fillRect(particle.x, particle.y, 3, 3);
                    ctx.globalAlpha = 1;
                });
            }

            function updateDefaultGame() {
                if (!gameState.running || gameState.paused) return;

                // Update particles
                gameState.particles = gameState.particles.filter(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.life--;
                    return particle.life > 0;
                });

                // Check target collection
                gameState.targets.forEach(target => {
                    if (!target.collected &&
                        gameState.player.x < target.x + target.width &&
                        gameState.player.x + gameState.player.width > target.x &&
                        gameState.player.y < target.y + target.height &&
                        gameState.player.y + gameState.player.height > target.y) {
                        
                        target.collected = true;
                        gameState.score += 100;
                        scoreDisplay.textContent = `Score: ${gameState.score}`;
                        
                        // Create particles
                        for (let i = 0; i < 8; i++) {
                            gameState.particles.push({
                                x: target.x + target.width/2,
                                y: target.y + target.height/2,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 30,
                                maxLife: 30
                            });
                        }
                        
                        playSound('score');
                    }
                });

                // Check win condition
                if (gameState.targets.every(target => target.collected)) {
                    setTimeout(() => {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.font = '24px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('All Targets Collected!', canvas.width / 2, canvas.height / 2);
                        ctx.fillText(`Final Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 30);
                        ctx.textAlign = 'left';
                        gameState.running = false;
                    }, 1000);
                }

                drawDefaultGame();
                gameState.animationId = requestAnimationFrame(updateDefaultGame);
            }

            window.currentGameKeyHandler = (e) => {
                if (!gameState.running || gameState.paused) return;
                const speed = 5;
                switch(e.key) {
                    case 'ArrowUp':
                        gameState.player.y = Math.max(0, gameState.player.y - speed);
                        break;
                    case 'ArrowDown':
                        gameState.player.y = Math.min(canvas.height - gameState.player.height, gameState.player.y + speed);
                        break;
                    case 'ArrowLeft':
                        gameState.player.x = Math.max(0, gameState.player.x - speed);
                        break;
                    case 'ArrowRight':
                        gameState.player.x = Math.min(canvas.width - gameState.player.width, gameState.player.x + speed);
                        break;
                }
                playSound('move');
            };

            document.addEventListener('keydown', window.currentGameKeyHandler);
            drawDefaultGame();
            updateDefaultGame();
        }

          // Enhanced Platformer Preview Game Implementation

            function createParticle(x, y, color, velocityX = 0, velocityY = 0) {

                    x: x,
                    y: y,
                    velocityX: velocityX + (Math.random() - 0.5) * 4,
                    velocityY: velocityY + (Math.random() - 0.5) * 4,
                    life: 30 + Math.random() * 20,
                    maxLife: 50,

                    size: Math.random() * 3 + 1
                };

            // Initialize game objects

            gameState.enemies = createEnemies();
            gameState.coins = createCoins();

            function drawPlatformerGame() {
                if (!gameState.running) return;

                // Sky blue gradient background
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#E0F6FF');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Simple clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 3; i++) {
                    const cloudX = (i * 200 + 50 - gameState.gameCamera.x * 0.1) % (canvas.width + 100);
                    const cloudY = 50 + i * 30;
                    ctx.beginPath();
                    ctx.arc(cloudX, cloudY, 20, 0, Math.PI * 2);
                    ctx.arc(cloudX + 25, cloudY, 25, 0, Math.PI * 2);
                    ctx.arc(cloudX + 50, cloudY, 20, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Calculate camera offset
                gameState.gameCamera.x = Math.max(0, gameState.player.x - canvas.width / 2);
                
                // Draw platforms
                gameState.platforms.forEach(platform => {
                    switch(platform.type) {
                        case 'ground':
                            ctx.fillStyle = '#8B4513';
                            break;
                        case 'platform':
                            ctx.fillStyle = '#228B22';
                            break;
                        case 'moving':
                            ctx.fillStyle = '#4169E1';
                            break;
                        default:
                            ctx.fillStyle = '#654321';
                    }
                    
                    ctx.fillRect(
                        platform.x - gameState.gameCamera.x,
                        platform.y,
                        platform.width,
                        platform.height
                    );
                    
                    // Add platform details
                    if (platform.type === 'ground') {
                        ctx.fillStyle = '#90EE90';
                        ctx.fillRect(
                            platform.x - gameState.gameCamera.x,

                            platform.width,

                        );

                // Draw coins with sparkle effect

                        // Sparkle animation

                        ctx.globalAlpha = sparkle;
                        
                        // Coin body
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        ctx.arc(coinX, coinY, coin.width/2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Coin highlight
                        ctx.fillStyle = '#FFFF99';
                        ctx.beginPath();
                        ctx.arc(coinX - 2, coinY - 2, coin.width/4, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.globalAlpha = 1;
                        
                        // Value indicator for bonus coins
                        if (coin.value > 100) {
                            ctx.fillStyle = '#FF6347';
                            ctx.font = '8px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('★', coinX, coinY + 2);
                            ctx.textAlign = 'left';
                        }
                    }
                });
                
                // Draw enemies with simple AI visualization

                    ctx.fillStyle = '#FF4444';
                    ctx.fillRect(
                        enemy.x - gameState.gameCamera.x,
                        enemy.y,
                        enemy.width,
                        enemy.height
                    );
                    
                    // Enemy eyes
                    ctx.fillStyle = '#FFFFFF';
                    const eyeSize = 2;
                    ctx.fillRect(
                        enemy.x - gameState.gameCamera.x + 2,
                        enemy.y + 2,
                        eyeSize,
                        eyeSize
                    );
                    ctx.fillRect(
                        enemy.x - gameState.gameCamera.x + enemy.width - 4,
                        enemy.y + 2,
                        eyeSize,
                        eyeSize
                    );
                    
                    // Direction indicator
                    ctx.fillStyle = '#FF0000';
                    const arrowX = enemy.x - gameState.gameCamera.x + (enemy.direction > 0 ? enemy.width : 0);
                    ctx.fillRect(arrowX, enemy.y + enemy.height/2, enemy.direction * 3, 1);
                });
                
                // Draw player with animation
                const playerX = gameState.player.x - gameState.gameCamera.x;
                const playerY = gameState.player.y;
                
                // Player body
                ctx.fillStyle = '#0066FF';
                ctx.fillRect(playerX, playerY, gameState.player.width, gameState.player.height);
                
                // Player face
                ctx.fillStyle = '#FFE4B5';
                ctx.fillRect(playerX + 2, playerY + 2, gameState.player.width - 4, gameState.player.height/3);
                
                // Player eyes
                ctx.fillStyle = '#000000';
                const eyeOffset = gameState.player.facingRight ? 2 : 0;
                ctx.fillRect(playerX + 4 + eyeOffset, playerY + 4, 2, 2);
                ctx.fillRect(playerX + 8 + eyeOffset, playerY + 4, 2, 2);
                
                // Movement animation (simple leg movement)
                if (Math.abs(gameState.player.velocityX) > 0.1) {
                    const legOffset = Math.sin(Date.now() * 0.02) * 2;
                    ctx.fillStyle = '#0066FF';
                    ctx.fillRect(playerX + 2, playerY + gameState.player.height, 4, 5 + legOffset);
                    ctx.fillRect(playerX + gameState.player.width - 6, playerY + gameState.player.height, 4, 5 - legOffset);

                gameState.particles.forEach(particle => {

                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'left';
                }

            function updatePlatformerGame(currentTime) {
                if (!gameState.running) return;

                if (gameState.paused) {
                    drawPlatformerGame();
                    gameState.animationId = requestAnimationFrame(updatePlatformerGame);
                    return;
                }

                // Handle continuous key presses
                if (gameState.keys['ArrowLeft'] || gameState.keys['a']) {
                    gameState.player.velocityX = -gameState.player.speed;
                    gameState.player.facingRight = false;
                }
                if (gameState.keys['ArrowRight'] || gameState.keys['d']) {
                    gameState.player.velocityX = gameState.player.speed;
                    gameState.player.facingRight = true;
                }
                
                // Apply gravity
                gameState.player.velocityY += gameState.gravity;
                
                // Update player position
                gameState.player.x += gameState.player.velocityX;
                gameState.player.y += gameState.player.velocityY;
                
                // Platform collision detection
                gameState.player.onGround = false;
                gameState.platforms.forEach(platform => {
                    if (gameState.player.x < platform.x + platform.width &&
                        gameState.player.x + gameState.player.width > platform.x &&
                        gameState.player.y < platform.y + platform.height &&
                        gameState.player.y + gameState.player.height > platform.y) {
                        
                        // Landing on top of platform
                        if (gameState.player.velocityY > 0 && gameState.player.y < platform.y) {
                            gameState.player.y = platform.y - gameState.player.height;
                            gameState.player.velocityY = 0;
                            gameState.player.onGround = true;
                        }
                        // Hitting platform from below
                        else if (gameState.player.velocityY < 0 && gameState.player.y > platform.y) {
                            gameState.player.y = platform.y + platform.height;
                            gameState.player.velocityY = 0;
                        }
                        // Side collisions
                        else if (gameState.player.velocityX > 0) {
                            gameState.player.x = platform.x - gameState.player.width;
                            gameState.player.velocityX = 0;
                        }
                        else if (gameState.player.velocityX < 0) {
                            gameState.player.x = platform.x + platform.width;
                            gameState.player.velocityX = 0;
                        }
                    }
                });
                
                // Update enemies
                gameState.enemies.forEach(enemy => {
                    enemy.x += enemy.velocityX;
                    
                    // Simple AI: reverse direction at platform edges or walls
                    const platform = gameState.platforms.find(p => 
                        enemy.x >= p.x - 20 && enemy.x <= p.x + p.width + 20 && 
                        Math.abs(enemy.y + enemy.height - p.y) < 10
                    );
                    
                    if (platform) {
                        if (enemy.x <= platform.x + 5 || enemy.x >= platform.x + platform.width - enemy.width - 5) {
                            enemy.velocityX *= -1;
                            enemy.direction *= -1;
                        }
                    }
                    
                    // Keep enemies on platforms
                    if (!platform) {
                        enemy.velocityX *= -1;
                        enemy.direction *= -1;
                    }
                });
                
                // Coin collection
                gameState.coins.forEach(coin => {
                    if (!coin.collected &&
                        gameState.player.x < coin.x + coin.width &&
                        gameState.player.x + gameState.player.width > coin.x &&
                        gameState.player.y < coin.y + coin.height &&
                        gameState.player.y + gameState.player.height > coin.y) {
                        
                        coin.collected = true;
                        gameState.score += coin.value;
                        
                        // Create coin collection particles
                        for (let i = 0; i < 5; i++) {
                            gameState.particles.push(createParticle(
                                coin.x + coin.width/2,
                                coin.y + coin.height/2,
                                '#FFD700',
                                0, -2
                            ));
                        }
                        
                        playSound('score');
                    }
                });
                
                // Enemy collision
                gameState.enemies.forEach((enemy, index) => {
                    if (gameState.player.x < enemy.x + enemy.width &&
                        gameState.player.x + gameState.player.width > enemy.x &&
                        gameState.player.y < enemy.y + enemy.height &&
                        gameState.player.y + gameState.player.height > enemy.y) {
                        
                        // Check if player is jumping on enemy
                        if (gameState.player.velocityY > 0 && gameState.player.y < enemy.y) {
                            // Destroy enemy
                            gameState.enemies.splice(index, 1);
                            gameState.score += 200;
                            gameState.player.velocityY = -8; // Bounce
                            
                            // Create destruction particles
                            for (let i = 0; i < 8; i++) {
                                gameState.particles.push(createParticle(
                                    enemy.x + enemy.width/2,
                                    enemy.y + enemy.height/2,
                                    '#FF4444'
                                ));
                            }
                            
                            playSound('score');
                        } else {
                            // Player takes damage
                            gameState.lives--;
                            gameState.player.x = 50;
                            gameState.player.y = canvas.height - 100;
                            gameState.player.velocityX = 0;
                            gameState.player.velocityY = 0;
                            
                            // Create damage particles
                            for (let i = 0; i < 6; i++) {
                                gameState.particles.push(createParticle(
                                    gameState.player.x + gameState.player.width/2,
                                    gameState.player.y + gameState.player.height/2,
                                    '#FF0000'
                                ));
                            }
                            
                            playSound('gameOver');
                            
                            if (gameState.lives <= 0) {
                                gameOver();
                                return;
                            }
                        }
                    }
                });
                
                // Update particles
                gameState.particles = gameState.particles.filter(particle => {
                    particle.x += particle.velocityX;
                    particle.y += particle.velocityY;
                    particle.velocityX *= 0.98;
                    particle.velocityY += 0.1; // Gravity
                    particle.life--;

                    const collectedCoins = gameState.coins.filter(c => c.collected).length;
                    scoreDisplay.textContent = `Score: ${gameState.score} | Lives: ${gameState.lives} | Coins: ${collectedCoins}/${totalCoins}`;

        function initializeChessPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                currentPlayer: 'white',
                selectedSquare: null,

                gameStatus: 'playing',
                whiteKingPos: { row: 7, col: 4 },
                blackKingPos: { row: 0, col: 4 }
            };

            gamePreviewStates[gameId] = gameState;

            function createChessBoard() {
                const board = Array(8).fill(null).map(() => Array(8).fill(null));
                
                // Place pieces
                const pieces = {
                    'r': 'rook', 'n': 'knight', 'b': 'bishop', 'q': 'queen', 
                    'k': 'king', 'p': 'pawn'
                };
                
                // Black pieces (top)
                const blackSetup = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
                for (let i = 0; i < 8; i++) {
                    board[0][i] = { type: pieces[blackSetup[i]], color: 'black' };
                    board[1][i] = { type: 'pawn', color: 'black' };
                }
                
                // White pieces (bottom)
                const whiteSetup = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
                for (let i = 0; i < 8; i++) {
                    board[7][i] = { type: pieces[whiteSetup[i]], color: 'white' };
                    board[6][i] = { type: 'pawn', color: 'white' };
                }
                
                return board;
            }

            function drawChessBoard() {
                if (!gameState.running) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw board squares
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const isLight = (row + col) % 2 === 0;
                        ctx.fillStyle = isLight ? '#F0D9B5' : '#B58863';
                        
                        // Highlight selected square
                        if (gameState.selectedSquare && gameState.selectedSquare.row === row && gameState.selectedSquare.col === col) {
                            ctx.fillStyle = '#FFD700';
                        }
                        
                        ctx.fillRect(col * gameState.squareSize, row * gameState.squareSize, gameState.squareSize, gameState.squareSize);
                        
                        // Draw piece
                        const piece = gameState.gameBoard[row][col];
                        if (piece) {
                            drawChessPiece(ctx, piece, col * gameState.squareSize, row * gameState.squareSize, gameState.squareSize);
                        }
                    }
                }
                
                // Draw game info
                ctx.fillStyle = '#000000';
                ctx.font = '14px Arial';
                ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(`${gameState.currentPlayer.toUpperCase()}'s turn - ${gameState.gameStatus}`, 10, canvas.height - 10);

                // Show pause overlay
                if (gameState.paused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'left';
                }
            }

            function drawChessPiece(ctx, piece, x, y, size) {
                // Use simple geometric shapes instead of Unicode symbols for better compatibility
                ctx.fillStyle = piece.color === 'white' ? '#FFFFFF' : '#000000';
                ctx.strokeStyle = piece.color === 'white' ? '#000000' : '#FFFFFF';
                ctx.lineWidth = 2;
                
                const centerX = x + size/2;
                const centerY = y + size/2;
                const pieceSize = size * 0.6;
                
                switch(piece.type) {
                    case 'king':
                        // Draw crown shape
                        ctx.fillRect(centerX - pieceSize/3, centerY - pieceSize/4, pieceSize * 2/3, pieceSize/2);
                        ctx.strokeRect(centerX - pieceSize/3, centerY - pieceSize/4, pieceSize * 2/3, pieceSize/2);
                        // Crown points
                        for (let i = 0; i < 3; i++) {
                            const px = centerX - pieceSize/4 + (i * pieceSize/4);
                            ctx.fillRect(px - 2, centerY - pieceSize/2, 4, pieceSize/4);
                        }
                        break;
                    case 'queen':
                        // Draw tall shape with multiple points
                        ctx.fillRect(centerX - pieceSize/4, centerY - pieceSize/3, pieceSize/2, pieceSize * 2/3);
                        ctx.strokeRect(centerX - pieceSize/4, centerY - pieceSize/3, pieceSize/2, pieceSize * 2/3);
                        // Multiple crown points
                        for (let i = 0; i < 5; i++) {
                            const px = centerX - pieceSize/3 + (i * pieceSize/6);
                            const height = i % 2 === 0 ? pieceSize/3 : pieceSize/4;
                            ctx.fillRect(px - 1, centerY - pieceSize/2, 2, height);
                        }
                        break;
                    case 'rook':
                        // Draw castle battlement
                        ctx.fillRect(centerX - pieceSize/3, centerY - pieceSize/4, pieceSize * 2/3, pieceSize/2);
                        ctx.strokeRect(centerX - pieceSize/3, centerY - pieceSize/4, pieceSize * 2/3, pieceSize/2);
                        // Battlements
                        for (let i = 0; i < 3; i++) {
                            const px = centerX - pieceSize/4 + (i * pieceSize/4);
                            ctx.clearRect(px - 2, centerY - pieceSize/2, 4, pieceSize/6);
                        }
                        break;
                    case 'bishop':
                        // Draw pointed hat shape
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY - pieceSize/2);
                        ctx.lineTo(centerX - pieceSize/4, centerY + pieceSize/4);
                        ctx.lineTo(centerX + pieceSize/4, centerY + pieceSize/4);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        // Small circle at top
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - pieceSize/3, 3, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'knight':
                        // Draw horse head shape
                        ctx.beginPath();
                        ctx.moveTo(centerX - pieceSize/4, centerY + pieceSize/4);
                        ctx.lineTo(centerX - pieceSize/6, centerY - pieceSize/4);
                        ctx.lineTo(centerX + pieceSize/6, centerY - pieceSize/6);
                        ctx.lineTo(centerX + pieceSize/4, centerY);
                        ctx.lineTo(centerX + pieceSize/6, centerY + pieceSize/4);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        break;
                    case 'pawn':
                        // Draw simple circle on base
                        ctx.beginPath();
                        ctx.arc(centerX, centerY - pieceSize/6, pieceSize/4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillRect(centerX - pieceSize/4, centerY + pieceSize/6, pieceSize/2, pieceSize/8);
                        ctx.strokeRect(centerX - pieceSize/4, centerY + pieceSize/6, pieceSize/2, pieceSize/8);
                        break;
                }
                
                // Add piece type label for clarity
                ctx.fillStyle = piece.color === 'white' ? '#000000' : '#FFFFFF';
                ctx.font = '8px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(piece.type.charAt(0).toUpperCase(), centerX, y + size - 3);
                ctx.textAlign = 'left';
            }

            function isValidMove(fromRow, fromCol, toRow, toCol) {
                const piece = gameState.gameBoard[fromRow][fromCol];
                const targetPiece = gameState.gameBoard[toRow][toCol];
                
                if (!piece || piece.color !== gameState.currentPlayer) return false;
                if (targetPiece && targetPiece.color === piece.color) return false;
                
                const rowDiff = toRow - fromRow;
                const colDiff = toCol - fromCol;
                const absRowDiff = Math.abs(rowDiff);
                const absColDiff = Math.abs(colDiff);
                
                switch (piece.type) {
                    case 'pawn':
                        const direction = piece.color === 'white' ? -1 : 1;
                        if (colDiff === 0) {
                            if (rowDiff === direction && !targetPiece) return true;
                            if (rowDiff === 2 * direction && !targetPiece && 
                                ((piece.color === 'white' && fromRow === 6) || 
                                 (piece.color === 'black' && fromRow === 1))) return true;
                        } else if (absColDiff === 1 && rowDiff === direction && targetPiece) {
                            return true;
                        }
                        return false;
                        
                    case 'rook':
                        return (rowDiff === 0 || colDiff === 0) && isPathClear(fromRow, fromCol, toRow, toCol);
                        
                    case 'bishop':
                        return absRowDiff === absColDiff && isPathClear(fromRow, fromCol, toRow, toCol);
                        
                    case 'queen':
                        return (rowDiff === 0 || colDiff === 0 || absRowDiff === absColDiff) && 
                               isPathClear(fromRow, fromCol, toRow, toCol);
                        
                    case 'king':
                        return absRowDiff <= 1 && absColDiff <= 1;
                        
                    case 'knight':
                        return (absRowDiff === 2 && absColDiff === 1) || (absRowDiff === 1 && absColDiff === 2);
                }
                
                return false;
            }

            function isPathClear(fromRow, fromCol, toRow, toCol) {
                const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
                const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;
                
                let currentRow = fromRow + rowStep;
                let currentCol = fromCol + colStep;
                
                while (currentRow !== toRow || currentCol !== toCol) {
                    if (gameState.gameBoard[currentRow][currentCol]) return false;
                    currentRow += rowStep;
                    currentCol += colStep;
                }
                
                return true;
            }

            function makeMove(fromRow, fromCol, toRow, toCol) {
                const piece = gameState.gameBoard[fromRow][fromCol];
                const capturedPiece = gameState.gameBoard[toRow][toCol];
                
                gameState.moveHistory.push({
                    from: { row: fromRow, col: fromCol },
                    to: { row: toRow, col: toCol },
                    piece: piece,
                    captured: capturedPiece
                });
                
                gameState.gameBoard[toRow][toCol] = piece;
                gameState.gameBoard[fromRow][fromCol] = null;
                
                // Update king positions
                if (piece.type === 'king') {
                    if (piece.color === 'white') {
                        gameState.whiteKingPos = { row: toRow, col: toCol };
                    } else {
                        gameState.blackKingPos = { row: toRow, col: toCol };
                    }
                }
                
                gameState.currentPlayer = gameState.currentPlayer === 'white' ? 'black' : 'white';
                
                if (capturedPiece) {
                    playSound('score');
                } else {
                    playSound('move');
                }
                
                if (scoreDisplay) {
                    scoreDisplay.textContent = `Move ${gameState.moveHistory.length} | ${gameState.currentPlayer}'s turn`;
                }
            }

            // Handle mouse clicks
            function handleChessClick(event) {
                if (!gameState.running || gameState.paused) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;
                
                const col = Math.floor(x / gameState.squareSize);
                const row = Math.floor(y / gameState.squareSize);
                
                if (row < 0 || row >= 8 || col < 0 || col >= 8) return;
                
                if (gameState.selectedSquare) {
                    if (isValidMove(gameState.selectedSquare.row, gameState.selectedSquare.col, row, col)) {
                        makeMove(gameState.selectedSquare.row, gameState.selectedSquare.col, row, col);
                    }
                    gameState.selectedSquare = null;
                    gameState.selectedPiece = null;
                } else {
                    const piece = gameState.gameBoard[row][col];
                    if (piece && piece.color === gameState.currentPlayer) {
                        gameState.selectedSquare = { row, col };
                        gameState.selectedPiece = piece;
                    }
                }
                
                drawChessBoard();
            }

            // Event handlers
            window.currentGameKeyHandler = (e) => {
                // Chess uses mouse input primarily
            };

            const clickHandler = handleChessClick;
            canvas.addEventListener('click', clickHandler);
            gameState.clickHandler = clickHandler;

            document.addEventListener('keydown', window.currentGameKeyHandler);

            if (scoreDisplay) {
                scoreDisplay.textContent = `Move 0 | White's turn`;
            }

            drawChessBoard();
        }

        // Enhanced Pacman Preview Game Implementation
        function initializePacmanPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
