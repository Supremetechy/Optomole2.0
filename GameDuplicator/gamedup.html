<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Marketplace - Functional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cart-slide-in { transform: translateX(0) !important; }
        .notification { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <header class="bg-gray-800 shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-gamepad text-3xl text-purple-500"></i>
                    <h1 class="text-2xl font-bold">GameDupe <span class="text-purple-500">Pro</span></h1>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openMarketplace()" class="bg-pink-600 hover:bg-pink-700 px-3 py-2 rounded-lg font-medium transition text-sm">
                        <i class="fas fa-shopping-cart mr-1"></i>Marketplace
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <section class="text-center">
            <div class="bg-gradient-to-r from-pink-600 to-purple-600 rounded-xl p-8">
                <h2 class="text-3xl font-bold mb-4">Game Marketplace</h2>
                <p class="text-pink-100 mb-6">Browse and purchase amazing community games</p>
                <button onclick="openMarketplace()" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-8 py-3 rounded-lg font-medium transition">
                    <i class="fas fa-store mr-2"></i>Open Marketplace
                </button>
            </div>
        </section>
    </main>

    <!-- Marketplace Overlay -->
    <div id="marketplaceOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden">
        <div class="fixed inset-0 overflow-y-auto">
            <div class="min-h-screen bg-gray-900">
                <!-- Header -->
                <div class="bg-gradient-to-r from-purple-600 to-pink-600 text-white sticky top-0 z-10">
                    <div class="container mx-auto px-4 py-6">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <i class="fas fa-shopping-cart text-3xl"></i>
                                <div>
                                    <h1 class="text-3xl font-bold">Game Marketplace</h1>
                                    <p class="text-purple-100">Discover amazing games</p>
                                </div>
                            </div>
                            <button onclick="closeMarketplace()" class="text-white hover:text-purple-200 text-2xl p-2">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="bg-gray-800 border-b border-gray-700 sticky top-24 z-10">
                    <div class="container mx-auto px-4 py-4">
                        <div class="flex flex-col md:flex-row gap-4">
                            <div class="flex-1 relative">
                                <input type="text" id="searchInput" placeholder="Search games..." 
                                       class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 pl-10 text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
                                       onkeyup="handleSearch()">
                                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                            </div>
                            <select id="categorySelect" onchange="handleFilter()" class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                                <option value="All">All Categories</option>
                                <option value="Action">Action</option>
                                <option value="Puzzle">Puzzle</option>
                                <option value="Strategy">Strategy</option>
                                <option value="Racing">Racing</option>
                                <option value="RPG">RPG</option>
                                <option value="Casual">Casual</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Games Grid -->
                <div class="container mx-auto px-4 py-6">
                    <div class="mb-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold text-white">Available Games</h2>
                            <div class="text-gray-400">
                                <span id="gameCount">0</span> games found
                            </div>
                        </div>
                    </div>
                    <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <!-- Games will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Shopping Cart -->
    <div id="cartSidebar" class="fixed top-0 right-0 h-full w-80 bg-gray-800 transform translate-x-full transition-transform duration-300 z-50 border-l border-gray-700">
        <div class="flex flex-col h-full">
            <div class="p-4 border-b border-gray-700">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-white">Shopping Cart</h3>
                    <button onclick="closeCart()" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto p-4">
                <div class="text-center text-gray-400 py-8">
                    <i class="fas fa-shopping-cart text-4xl mb-4"></i>
                    <p>Your cart is empty</p>
                </div>
            </div>
            <div class="p-4 border-t border-gray-700">
                <div class="mb-4">
                    <div class="flex justify-between text-white">
                        <span>Total:</span>
                        <span id="cartTotal" class="font-bold">$0.00</span>
                    </div>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-medium text-white transition">
                    <i class="fas fa-credit-card mr-2"></i>Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Cart Button -->
    <button id="cartToggle" onclick="toggleCart()" class="fixed bottom-6 right-6 bg-purple-600 hover:bg-purple-700 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg transition z-40">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs flex items-center justify-center hidden">0</span>
    </button>

    <!-- Game Detail Modal -->
    <div id="gameModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center hidden" onclick="closeGameModal(event)">
        <div class="bg-gray-800 rounded-xl shadow-2xl w-full max-w-2xl mx-4 max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
            <div id="gameModalContent">
                <!-- Game details will be populated here -->
            </div>
        </div>
    </div>

    <script>
        // Game data
        const games = [
            {
                id: 'mp001',
                title: 'Neon Runner Redux',
                description: 'A cyberpunk endless runner with stunning neon visuals and electronic soundtrack.',
                category: 'Action',
                author: 'CyberDev Studios',
                rating: 4.8,
                downloads: 15420,
                price: 'Free',
                isPremium: false,
                tags: ['cyberpunk', 'runner', 'neon'],
                thumbnail: 'https://via.placeholder.com/400x225/1E40AF/FFFFFF?text=Neon+Runner',
                fileSize: '12.3 MB',
                version: '1.2.0'
            },
            {
                id: 'mp002',
                title: 'Mystic Puzzle Quest',
                description: 'Solve ancient puzzles and unlock magical secrets in this enchanting adventure.',
                category: 'Puzzle',
                author: 'Mystic Games',
                rating: 4.6,
                downloads: 8930,
                price: '$2.99',
                isPremium: true,
                tags: ['puzzle', 'magic', 'adventure'],
                thumbnail: 'https://via.placeholder.com/400x225/059669/FFFFFF?text=Mystic+Quest',
                fileSize: '25.7 MB',
                version: '2.1.0'
            },
            {
                id: 'mp003',
                title: 'Space Colony Builder',
                description: 'Build and manage your own space colony on distant planets.',
                category: 'Strategy',
                author: 'Stellar Studios',
                rating: 4.9,
                downloads: 22150,
                price: '$4.99',
                isPremium: true,
                tags: ['strategy', 'space', 'building'],
                thumbnail: 'https://via.placeholder.com/400x225/1F2937/FFFFFF?text=Space+Colony',
                fileSize: '45.2 MB',
                version: '3.0.1'
            },
            {
                id: 'mp004',
                title: 'Retro Racer Championship',
                description: 'Classic arcade racing with retro graphics and modern gameplay.',
                category: 'Racing',
                author: 'Retro Games Inc.',
                rating: 4.4,
                downloads: 12760,
                price: 'Free',
                isPremium: false,
                tags: ['racing', 'retro', 'arcade'],
                thumbnail: 'https://via.placeholder.com/400x225/DC2626/FFFFFF?text=Retro+Racer',
                fileSize: '18.9 MB',
                version: '1.5.2'
            },
            {
                id: 'mp005',
                title: 'Dragon Quest Legends',
                description: 'Epic fantasy RPG with dragons, magic, and legendary adventures.',
                category: 'RPG',
                author: 'Fantasy Forge',
                rating: 4.7,
                downloads: 19420,
                price: '$6.99',
                isPremium: true,
                tags: ['rpg', 'fantasy', 'dragons'],
                thumbnail: 'https://via.placeholder.com/400x225/7C2D12/FFFFFF?text=Dragon+Quest',
                fileSize: '67.3 MB',
                version: '4.2.1'
            },
            {
                id: 'mp006',
                title: 'Bubble Pop Mania',
                description: 'Addictive bubble-popping game with hundreds of challenging levels.',
                category: 'Casual',
                author: 'Casual Crown',
                rating: 4.3,
                downloads: 31250,
                price: 'Free',
                isPremium: false,
                tags: ['casual', 'puzzle', 'bubbles'],
                thumbnail: 'https://via.placeholder.com/400x225/EC4899/FFFFFF?text=Bubble+Pop',
                fileSize: '8.4 MB',
                version: '2.3.0'
            }
        ];

        // State management
        let filteredGames = [...games];
        let cart = [];
        let favorites = [];

        // Utility functions
        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            const emptyStars = 5 - Math.ceil(rating);
            for (let i = 0; i < emptyStars; i++) {
                stars += '<i class="far fa-star"></i>';
            }
            return stars;
        }

        function showNotification(message, type = 'info') {
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                info: 'bg-blue-600',
                warning: 'bg-yellow-600'
            };

            const notification = document.createElement('div');
            notification.className = `notification fixed top-4 right-4 ${colors[type]} text-white px-6 py-4 rounded-lg shadow-lg z-50`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-info-circle mr-3"></i>
                    <span>${message}</span>
                </div>
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Marketplace functions
        function openMarketplace() {
            document.getElementById('marketplaceOverlay').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            renderGames();
        }

        function closeMarketplace() {
            document.getElementById('marketplaceOverlay').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            
            filteredGames = games.filter(game => {
                const matchesSearch = game.title.toLowerCase().includes(searchTerm) || 
                                    game.description.toLowerCase().includes(searchTerm) ||
                                    game.author.toLowerCase().includes(searchTerm);
                const matchesCategory = category === 'All' || game.category === category;
                
                return matchesSearch && matchesCategory;
            });
            
            renderGames();
        }

        function handleFilter() {
            handleSearch(); // Reuse search logic
        }

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const count = document.getElementById('gameCount');
            
            count.textContent = filteredGames.length;
            
            if (filteredGames.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-8">No games found</div>';
                return;
            }

            grid.innerHTML = filteredGames.map(game => `
                <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-xl transition duration-300">
                    <div class="relative">
                        <img src="${game.thumbnail}" alt="${game.title}" class="w-full h-40 object-cover">
                        <div class="absolute top-2 right-2">
                            <button onclick="toggleFavorite('${game.id}')" class="text-white hover:text-red-400 transition">
                                <i class="fas fa-heart ${favorites.includes(game.id) ? 'text-red-400' : ''}"></i>
                            </button>
                        </div>
                        <div class="absolute bottom-2 left-2">
                            <span class="bg-purple-600 text-white text-xs px-2 py-1 rounded">${game.category}</span>
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg text-white mb-1">${game.title}</h3>
                        <p class="text-gray-400 text-sm mb-2">By ${game.author}</p>
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center text-yellow-400">
                                ${renderStars(game.rating)}
                                <span class="ml-1 text-sm">${game.rating}</span>
                            </div>
                            <span class="text-lg font-bold ${game.isPremium ? 'text-green-400' : 'text-purple-400'}">${game.price}</span>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="showGameDetails('${game.id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded text-white text-sm transition">
                                <i class="fas fa-info-circle mr-1"></i>Details
                            </button>
                            ${game.isPremium ? 
                                `<button onclick="addToCart('${game.id}')" class="flex-1 bg-green-600 hover:bg-green-700 px-3 py-2 rounded text-white text-sm transition">
                                    <i class="fas fa-shopping-cart mr-1"></i>Cart
                                </button>` :
                                `<button onclick="downloadGame('${game.id}')" class="flex-1 bg-purple-600 hover:bg-purple-700 px-3 py-2 rounded text-white text-sm transition">
                                    <i class="fas fa-download mr-1"></i>Get
                                </button>`
                            }
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Game actions
        function showGameDetails(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) return;

            const modal = document.getElementById('gameModal');
            const content = document.getElementById('gameModalContent');
            
            content.innerHTML = `
                <div class="relative">
                    <button onclick="closeGameModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white z-10">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                    
                    <div class="relative">
                        <img src="${game.thumbnail}" alt="${game.title}" class="w-full h-48 object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                        <div class="absolute bottom-4 left-6">
                            <h1 class="text-2xl font-bold text-white mb-1">${game.title}</h1>
                            <p class="text-gray-200">By ${game.author}</p>
                        </div>
                    </div>

                    <div class="p-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div class="bg-gray-700 rounded-lg p-3 text-center">
                                <div class="text-yellow-400 font-bold">${game.rating}</div>
                                <div class="text-gray-400 text-sm">Rating</div>
                            </div>
                            <div class="bg-gray-700 rounded-lg p-3 text-center">
                                <div class="text-purple-400 font-bold">${game.downloads.toLocaleString()}</div>
                                <div class="text-gray-400 text-sm">Downloads</div>
                            </div>
                            <div class="bg-gray-700 rounded-lg p-3 text-center">
                                <div class="text-blue-400 font-bold">${game.fileSize}</div>
                                <div class="text-gray-400 text-sm">Size</div>
                            </div>
                            <div class="bg-gray-700 rounded-lg p-3 text-center">
                                <div class="text-green-400 font-bold">${game.price}</div>
                                <div class="text-gray-400 text-sm">Price</div>
                            </div>
                        </div>

                        <div class="mb-6">
                            <h3 class="text-xl font-bold text-white mb-3">Description</h3>
                            <p class="text-gray-300 leading-relaxed">${game.description}</p>
                        </div>

                        <div class="mb-6">
                            <h3 class="text-xl font-bold text-white mb-3">Tags</h3>
                            <div class="flex flex-wrap gap-2">
                                ${game.tags.map(tag => `
                                    <span class="bg-purple-600 text-white text-sm px-3 py-1 rounded-full">${tag}</span>
                                `).join('')}
                            </div>
                        </div>

                        <div class="flex gap-4 pt-4 border-t border-gray-700">
                            <button onclick="toggleFavorite('${game.id}')" class="flex items-center px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition">
                                <i class="fas fa-heart mr-2 ${favorites.includes(game.id) ? 'text-red-400' : ''}"></i>
                                ${favorites.includes(game.id) ? 'Remove from Favorites' : 'Add to Favorites'}
                            </button>
                            ${game.isPremium ? 
                                `<button onclick="addToCart('${game.id}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition">
                                    <i class="fas fa-shopping-cart mr-2"></i>Add to Cart - ${game.price}
                                </button>` :
                                `<button onclick="downloadGame('${game.id}')" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-medium transition">
                                    <i class="fas fa-download mr-2"></i>Download Free
                                </button>`
                            }
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeGameModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('gameModal').classList.add('hidden');
        }

        function toggleFavorite(gameId) {
            const index = favorites.indexOf(gameId);
            if (index > -1) {
                favorites.splice(index, 1);
                showNotification('Removed from favorites', 'info');
            } else {
                favorites.push(gameId);
                showNotification('Added to favorites', 'success');
            }
            renderGames(); // Refresh to update heart icons
        }

        function addToCart(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game || cart.find(item => item.id === gameId)) {
                if (cart.find(item => item.id === gameId)) {
                    showNotification('Game already in cart', 'warning');
                }
                return;
            }

            cart.push(game);
            updateCartUI();
            showNotification(`${game.title} added to cart`, 'success');
        }

        function removeFromCart(gameId) {
            const index = cart.findIndex(item => item.id === gameId);
            if (index > -1) {
                const game = cart[index];
                cart.splice(index, 1);
                updateCartUI();
                showNotification(`${game.title} removed from cart`, 'info');
            }
        }

        function downloadGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) return;

            showNotification(`Downloading ${game.title}...`, 'info');
            
            setTimeout(() => {
                game.downloads += 1;
                showNotification(`${game.title} downloaded successfully!`, 'success');
                renderGames();
            }, 1500);
        }

        // Cart functions
        function toggleCart() {
            const cart = document.getElementById('cartSidebar');
            cart.classList.toggle('cart-slide-in');
        }

        function closeCart() {
            document.getElementById('cartSidebar').classList.remove('cart-slide-in');
        }

        function updateCartUI() {
            const cartBadge = document.getElementById('cartBadge');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            if (cart.length > 0) {
                cartBadge.textContent = cart.length;
                cartBadge.classList.remove('hidden');
            } else {
                cartBadge.classList.add('hidden');
            }

            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-shopping-cart text-4xl mb-4"></i>
                        <p>Your cart is empty</p>
                    </div>
                `;
                cartTotal.textContent = '$0.00';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map(game => {
                const price = parseFloat(game.price.replace('$', ''));
                total += price;

                return `
                    <div class="flex items-center gap-3 p-3 bg-gray-700 rounded-lg mb-3">
                        <img src="${game.thumbnail}" alt="${game.title}" class="w-16 h-16 rounded object-cover">
                        <div class="flex-1">
                            <h4 class="font-medium text-white">${game.title}</h4>
                            <p class="text-gray-400 text-sm">By ${game.author}</p>
                            <p class="text-green-400 font-bold">${game.price}</p>
                        </div>
                        <button onclick="removeFromCart('${game.id}')" class="text-red-400 hover:text-red-300 transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');

            cartTotal.textContent = `$${total.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) {
                showNotification('Your cart is empty', 'warning');
                return;
            }

            const total = cart.reduce((sum, game) => sum + parseFloat(game.price.replace('$', '')), 0);
            
            showNotification('Processing payment...', 'info');
            
            setTimeout(() => {
                showNotification(`Purchase of $${total.toFixed(2)} completed successfully!`, 'success');
                
                // Update download counts
                cart.forEach(game => {
                    const originalGame = games.find(g => g.id === game.id);
                    if (originalGame) originalGame.downloads += 1;
                });
                
                cart.length = 0; // Clear cart
                updateCartUI();
                closeCart();
                renderGames();
            }, 2000);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            renderGames();
        });
    </script>
</body>
</html>
