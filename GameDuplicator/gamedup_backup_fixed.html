<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameDuplicator - Game Marketplace</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Add your CSS styles here */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1a1a1a; color: white; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
        .modal-content { background: #2d2d2d; margin: 5% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 1200px; max-height: 90vh; overflow-y: auto; }
        .hidden { display: none; }
        /* Add more styles as needed */
    </style>
</head>
<body>
    <!-- Game Preview Modal -->
    <div id="gameModal" class="modal hidden">
        <div id="gameModalContent" class="modal-content">
            <!-- Modal content will be populated by JavaScript -->
        </div>
    </div>

    <!-- Game Preview Canvas Section (single demo instance) -->
    <div class="mb-6">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-xl font-bold text-white">Play Demo</h3>
            <div class="flex gap-2">
                <button id="settingsGameBtn-demo" onclick="toggleGameSettings('demo')" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-2 rounded-lg transition text-sm">
                    <i class="fas fa-cog mr-1"></i>Settings
                </button>
                <button id="playGameBtn-demo" onclick="startGamePreview('demo')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
                    <i class="fas fa-play mr-1"></i>Play
                </button>
                <button id="pauseGameBtn-demo" onclick="pauseGamePreview('demo')" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg transition hidden">
                    <i class="fas fa-pause mr-1"></i>Pause
                </button>
                <button id="stopGameBtn-demo" onclick="stopGamePreview('demo')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition hidden">
                    <i class="fas fa-stop mr-1"></i>Stop
                </button>
            </div>
        </div>

        <!-- Game Settings Panel -->
        <div id="gameSettings-demo" class="bg-gray-700 rounded-lg p-4 mb-4 hidden">
            <h4 class="text-white font-bold mb-3">Game Settings</h4>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-300 text-sm mb-1">Difficulty</label>
                    <select id="difficulty-demo" class="w-full bg-gray-600 border border-gray-500 rounded px-3 py-1 text-white text-sm">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm mb-1">Sound</label>
                    <select id="sound-demo" class="w-full bg-gray-600 border border-gray-500 rounded px-3 py-1 text-white text-sm">
                        <option value="on" selected>On</option>
                        <option value="off">Off</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm mb-1">Game Speed</label>
                    <input type="range" id="speed-demo" min="1" max="5" value="3" class="w-full">
                    <div class="text-xs text-gray-400 flex justify-between">
                        <span>Slow</span>
                        <span>Fast</span>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm mb-1">Controls</label>
                    <div class="text-xs text-gray-400">Arrow Keys</div>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg p-4">
            <canvas id="gamePreviewCanvas-demo" class="w-full bg-gray-900 rounded border" width="600" height="400" style="max-width: 100%; height: auto;"></canvas>
            <div id="gameInstructions-demo" class="mt-3 text-center text-gray-400 text-sm">
                Click Play to start the demo
            </div>
            <div id="gameScore-demo" class="mt-2 text-center text-white font-bold hidden">
                Score: 0
            </div>
        </div>
    </div>

    <script>
        // Game preview state management
        const gamePreviewStates = {};

        function safeStopGame(gameId) {
            const state = gamePreviewStates[gameId];
            if (state) {
                state.running = false;
                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                }
                if (state.intervalId) {
                    clearInterval(state.intervalId);
                }
                if (state.keyUpHandler) {
                    document.removeEventListener('keyup', state.keyUpHandler);
                    state.keyUpHandler = null;
                }
                if (state.clickHandler) {
                    const canvas = document.getElementById(`gamePreviewCanvas-${gameId}`);
                    if (canvas) {
                        canvas.removeEventListener('click', state.clickHandler);
                    }
                }
                delete gamePreviewStates[gameId];
            }
        }

        function startGamePreview(gameId) {
            const playBtn = document.getElementById(`playGameBtn-${gameId}`);
            const pauseBtn = document.getElementById(`pauseGameBtn-${gameId}`);
            const stopBtn = document.getElementById(`stopGameBtn-${gameId}`);
            const canvas = document.getElementById(`gamePreviewCanvas-${gameId}`);
            const scoreDisplay = document.getElementById(`gameScore-${gameId}`);
            const ctx = canvas.getContext('2d');

            if (!canvas || !ctx) return;

            // Stop any existing game preview
            safeStopGame(gameId);

            // Initialize based on game type
            const gameType = canvas.getAttribute('data-game-type') || 'default';
            if (gameType === 'shooter') {
                initializeShooterPreview(canvas, ctx, gameId, scoreDisplay);
            } else if (gameType === 'chess') {
                initializeChessPreview(canvas, ctx, gameId, scoreDisplay);
            } else if (gameType === 'snake') {
                initializeSnakePreview(canvas, ctx, gameId, scoreDisplay);
            } else if (gameType === 'tetris') {
                initializeTetrisPreview(canvas, ctx, gameId, scoreDisplay);
            } else if (gameType === 'pacman') {
                initializePacmanPreview(canvas, ctx, gameId, scoreDisplay);
            } else {
                initializeDefaultPreview(canvas, ctx, gameId, scoreDisplay);
            }

            playBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            stopBtn.classList.remove('hidden');
        }

        function pauseGamePreview(gameId) {
            const state = gamePreviewStates[gameId];
            if (state) {
                state.paused = !state.paused;
                const pauseBtn = document.getElementById(`pauseGameBtn-${gameId}`);
                pauseBtn.innerHTML = state.paused ? '<i class="fas fa-play mr-1"></i>Resume' : '<i class="fas fa-pause mr-1"></i>Pause';
            }
        }

        function stopGamePreview(gameId) {
            safeStopGame(gameId);
            const playBtn = document.getElementById(`playGameBtn-${gameId}`);
            const pauseBtn = document.getElementById(`pauseGameBtn-${gameId}`);
            const stopBtn = document.getElementById(`stopGameBtn-${gameId}`);
            const instructions = document.getElementById(`gameInstructions-${gameId}`);
            const scoreDisplay = document.getElementById(`gameScore-${gameId}`);

            if (playBtn) playBtn.classList.remove('hidden');
            if (pauseBtn) pauseBtn.classList.add('hidden');
            if (stopBtn) stopBtn.classList.add('hidden');
            if (instructions) instructions.textContent = 'Click Play to start the demo';
            if (scoreDisplay) scoreDisplay.classList.add('hidden');
        }

        // Enhanced Shooter Game Implementation
        function initializeShooterPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                score: 0,
                lives: 3,
                level: 1,
                player: {
                    x: canvas.width / 2 - 15,
                    y: canvas.height - 50,
                    width: 30,
                    height: 20,
                    speed: 6
                },
                bullets: [],
                enemies: [],
                enemyBullets: [],
                powerUps: [],
                particles: [],
                stars: [],
                enemySpawnTimer: 0,
                enemySpawnRate: 90,
                bulletSpeed: 8,
                enemySpeed: 2,
                keys: {},
                lastShotTime: 0,
                shotCooldown: 150
            };

            gamePreviewStates[gameId] = gameState;

            // Create star field
            for (let i = 0; i < 50; i++) {
                gameState.stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 3 + 1,
                    size: Math.random() * 2 + 1
                });
            }

            function createEnemy() {
                return {
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 25,
                    height: 20,
                    speed: gameState.enemySpeed + Math.random() * 1.5,
                    health: 1,
                    shootTimer: Math.floor(Math.random() * 120) + 60,
                    type: Math.random() > 0.9 ? 'fast' : 'normal'
                };
            }

            function createBullet(x, y, velocityY, isPlayerBullet = true) {
                return {
                    x: x,
                    y: y,
                    width: 4,
                    height: isPlayerBullet ? 8 : 6,
                    velocityY: velocityY,
                    isPlayerBullet: isPlayerBullet
                };
            }

            function createPowerUp(x, y) {
                const types = ['speed', 'multishot', 'shield', 'rapidfire'];
                return {
                    x: x,
                    y: y,
                    width: 15,
                    height: 15,
                    type: types[Math.floor(Math.random() * types.length)],
                    velocityY: 2,
                    life: 300
                };
            }

            function createParticle(x, y, color, count = 5) {
                for (let i = 0; i < count; i++) {
                    gameState.particles.push({
                        x: x,
                        y: y,
                        velocityX: (Math.random() - 0.5) * 10,
                        velocityY: (Math.random() - 0.5) * 10,
                        life: 20 + Math.random() * 20,
                        maxLife: 40,
                        color: color,
                        size: Math.random() * 3 + 1
                    });
                }
            }

            function drawShooterGame() {
                if (!gameState.running) return;

                // Space background
                ctx.fillStyle = '#000011';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw moving stars
                ctx.fillStyle = '#FFFFFF';
                gameState.stars.forEach(star => {
                    ctx.globalAlpha = 0.8;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                    ctx.globalAlpha = 1;
                });

                // Draw player ship
                ctx.fillStyle = '#00AAFF';
                ctx.fillRect(gameState.player.x, gameState.player.y, gameState.player.width, gameState.player.height);

                // Player ship details
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(gameState.player.x + 12, gameState.player.y - 5, 6, 5); // Cockpit
                ctx.fillStyle = '#FF4444';
                ctx.fillRect(gameState.player.x + 5, gameState.player.y + 5, 3, 3); // Left engine
                ctx.fillRect(gameState.player.x + 22, gameState.player.y + 5, 3, 3); // Right engine

                // Draw player bullets
                ctx.fillStyle = '#00FF00';
                gameState.bullets.forEach(bullet => {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                    // Bullet trail effect
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                    ctx.fillRect(bullet.x, bullet.y + bullet.height, bullet.width, bullet.height);
                    ctx.fillStyle = '#00FF00';
                });

                // Draw enemy bullets
                ctx.fillStyle = '#FF4444';
                gameState.enemyBullets.forEach(bullet => {
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });

                // Draw enemies
                gameState.enemies.forEach(enemy => {
                    if (enemy.type === 'fast') {
                        ctx.fillStyle = '#FF8800';
                    } else {
                        ctx.fillStyle = '#FF4444';
                    }

                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

                    // Enemy details
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(enemy.x + 2, enemy.y + 2, 3, 3);
                    ctx.fillRect(enemy.x + enemy.width - 5, enemy.y + 2, 3, 3);
                });

                // Draw power-ups
                gameState.powerUps.forEach(powerUp => {
                    const colors = {
                        speed: '#00FF00',
                        multishot: '#FF8800',
                        shield: '#00FFFF',
                        rapidfire: '#FF00FF'
                    };
                    ctx.fillStyle = colors[powerUp.type];

                    const pulse = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
                    ctx.globalAlpha = pulse;
                    ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                    ctx.globalAlpha = 1;
                });

                // Draw particles
                gameState.particles.forEach(particle => {
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = particle.life / particle.maxLife;
                    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                    ctx.globalAlpha = 1;
                });

                // Show pause overlay
                if (gameState.paused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'left';
                }
            }

            function updateShooterGame() {
                if (!gameState.running) return;

                if (!gameState.paused) {
                    // Handle continuous key presses
                    if (gameState.keys['ArrowLeft'] || gameState.keys['a']) {
                        gameState.player.x = Math.max(0, gameState.player.x - gameState.player.speed);
                    }
                    if (gameState.keys['ArrowRight'] || gameState.keys['d']) {
                        gameState.player.x = Math.min(canvas.width - gameState.player.width, gameState.player.x + gameState.player.speed);
                    }
                    if (gameState.keys['ArrowUp'] || gameState.keys['w']) {
                        gameState.player.y = Math.max(0, gameState.player.y - gameState.player.speed);
                    }
                    if (gameState.keys['ArrowDown'] || gameState.keys['s']) {
                        gameState.player.y = Math.min(canvas.height - gameState.player.height, gameState.player.y + gameState.player.speed);
                    }

                    // Auto-fire when space is held
                    if (gameState.keys[' '] && Date.now() - gameState.lastShotTime > gameState.shotCooldown) {
                        gameState.bullets.push(createBullet(
                            gameState.player.x + gameState.player.width/2 - 2,
                            gameState.player.y,
                            -gameState.bulletSpeed,
                            true
                        ));
                        gameState.lastShotTime = Date.now();
                        playSound('move');
                    }

                    // Update stars
                    gameState.stars.forEach(star => {
                        star.y += star.speed;
                        if (star.y > canvas.height) {
                            star.y = -5;
                            star.x = Math.random() * canvas.width;
                        }
                    });

                    // Spawn enemies
                    gameState.enemySpawnTimer++;
                    if (gameState.enemySpawnTimer >= gameState.enemySpawnRate) {
                        gameState.enemies.push(createEnemy());
                        gameState.enemySpawnTimer = 0;
                        gameState.enemySpawnRate = Math.max(30, gameState.enemySpawnRate - 0.5);
                    }

                    // Update bullets
                    gameState.bullets = gameState.bullets.filter(bullet => {
                        bullet.y += bullet.velocityY;
                        return bullet.y > -bullet.height && bullet.y < canvas.height + bullet.height;
                    });

                    gameState.enemyBullets = gameState.enemyBullets.filter(bullet => {
                        bullet.y += bullet.velocityY;
                        return bullet.y > -bullet.height && bullet.y < canvas.height + bullet.height;
                    });

                    // Update enemies
                    gameState.enemies.forEach(enemy => {
                        enemy.y += enemy.speed;

                        // Enemy shooting
                        enemy.shootTimer--;
                        if (enemy.shootTimer <= 0 && enemy.y > 50 && enemy.y < canvas.height - 100) {
                            gameState.enemyBullets.push(createBullet(
                                enemy.x + enemy.width/2,
                                enemy.y + enemy.height,
                                4,
                                false
                            ));
                            enemy.shootTimer = Math.floor(Math.random() * 120) + 60;
                        }
                    });

                    // Remove off-screen enemies
                    gameState.enemies = gameState.enemies.filter(enemy => enemy.y < canvas.height + 50);

                    // Update power-ups
                    gameState.powerUps.forEach(powerUp => {
                        powerUp.y += powerUp.velocityY;
                        powerUp.life--;
                    });
                    gameState.powerUps = gameState.powerUps.filter(powerUp =>
                        powerUp.y < canvas.height && powerUp.life > 0);

                    // Update particles
                    gameState.particles = gameState.particles.filter(particle => {
                        particle.x += particle.velocityX;
                        particle.y += particle.velocityY;
                        particle.life--;
                        particle.velocityX *= 0.98;
                        particle.velocityY *= 0.98;
                        return particle.life > 0;
                    });

                    // Collision detection - player bullets vs enemies
                    for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                        for (let j = gameState.enemies.length - 1; j >= 0; j--) {
                            const bullet = gameState.bullets[i];
                            const enemy = gameState.enemies[j];

                            if (bullet && enemy &&
                                bullet.x < enemy.x + enemy.width &&
                                bullet.x + bullet.width > enemy.x &&
                                bullet.y < enemy.y + enemy.height &&
                                bullet.y + bullet.height > enemy.y) {

                                // Hit!
                                gameState.bullets.splice(i, 1);

                                enemy.health--;
                                if (enemy.health <= 0) {
                                    gameState.score += enemy.type === 'fast' ? 150 : 100;

                                    // Create explosion
                                    createParticle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#FF8800', 8);

                                    // Chance to drop power-up
                                    if (Math.random() < 0.1) {
                                        gameState.powerUps.push(createPowerUp(enemy.x, enemy.y));
                                    }

                                    gameState.enemies.splice(j, 1);
                                    playSound('score');
                                }
                                break;
                            }
                        }
                    }

                    // Collision detection - enemy bullets vs player
                    for (let i = gameState.enemyBullets.length - 1; i >= 0; i--) {
                        const bullet = gameState.enemyBullets[i];

                        if (bullet.x < gameState.player.x + gameState.player.width &&
                            bullet.x + bullet.width > gameState.player.x &&
                            bullet.y < gameState.player.y + gameState.player.height &&
                            bullet.y + bullet.height > gameState.player.y) {

                            gameState.enemyBullets.splice(i, 1);
                            gameState.lives--;

                            // Create damage effect
                            createParticle(gameState.player.x + gameState.player.width/2,
                                         gameState.player.y + gameState.player.height/2, '#FF0000', 6);

                            playSound('gameOver');

                            if (gameState.lives <= 0) {
                                gameOver();
                                return;
                            }
                        }
                    }

                    // Power-up collection
                    for (let i = gameState.powerUps.length - 1; i >= 0; i--) {
                        const powerUp = gameState.powerUps[i];

                        if (powerUp.x < gameState.player.x + gameState.player.width &&
                            powerUp.x + powerUp.width > gameState.player.x &&
                            powerUp.y < gameState.player.y + gameState.player.height &&
                            powerUp.y + powerUp.height > gameState.player.y) {

                            gameState.powerUps.splice(i, 1);
                            gameState.score += 50;
                            playSound('score');

                            // Apply power-up effect
                            switch (powerUp.type) {
                                case 'speed':
                                    gameState.player.speed = Math.min(10, gameState.player.speed + 1);
                                    showNotification('Speed Boost!', 'success');
                                    break;
                                case 'multishot':
                                    showNotification('Multi-shot!', 'success');
                                    break;
                                case 'shield':
                                    gameState.lives = Math.min(5, gameState.lives + 1);
                                    showNotification('Extra Life!', 'success');
                                    break;
                                case 'rapidfire':
                                    gameState.shotCooldown = Math.max(50, gameState.shotCooldown - 20);
                                    showNotification('Rapid Fire!', 'success');
                                    break;
                            }
                        }
                    }

                    // Level progression
                    if (gameState.score > gameState.level * 1000) {
                        gameState.level++;
                        gameState.enemySpeed += 0.3;
                        showNotification(`Level ${gameState.level}!`, 'info');
                        playSound('lineClear');
                    }

                    // Update score display
                    if (scoreDisplay) {
                        scoreDisplay.textContent = `Score: ${gameState.score} | Lives: ${gameState.lives} | Level: ${gameState.level}`;
                    }
                }

                drawShooterGame();
                gameState.animationId = requestAnimationFrame(updateShooterGame);
            }

            function gameOver() {
                gameState.running = false;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText(`Final Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText(`Level Reached: ${gameState.level}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.font = '14px Arial';
                ctx.fillText('Click Stop and Play again to restart', canvas.width / 2, canvas.height / 2 + 70);
                ctx.textAlign = 'left';
            }

            // Enhanced keyboard handling
            window.currentGameKeyHandler = (e) => {
                if (!gameState.running) return;

                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'a', 'd', 'w', 's'].includes(e.key)) {
                    e.preventDefault();
                }

                gameState.keys[e.key] = true;

                // Manual shooting for single shots
                if (e.key === ' ' && !gameState.paused && Date.now() - gameState.lastShotTime > gameState.shotCooldown) {
                    gameState.bullets.push(createBullet(
                        gameState.player.x + gameState.player.width/2 - 2,
                        gameState.player.y,
                        -gameState.bulletSpeed,
                        true
                    ));
                    gameState.lastShotTime = Date.now();
                    playSound('move');
                }
            };

            const keyUpHandler = (e) => {
                gameState.keys[e.key] = false;
            };

            document.addEventListener('keydown', window.currentGameKeyHandler);
            document.addEventListener('keyup', keyUpHandler);

            gameState.keyUpHandler = keyUpHandler;

            if (scoreDisplay) {
                scoreDisplay.textContent = `Score: 0 | Lives: 3 | Level: 1`;
            }

            drawShooterGame();
            updateShooterGame();
        }

        // Enhanced Snake Preview Game Implementation
        function initializeSnakePreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                score: 0,
                snake: [{ x: 10, y: 10 }],
                direction: { x: 1, y: 0 },
                nextDirection: { x: 1, y: 0 }, // Add next direction buffer
                food: { x: 15, y: 15 },
                gridSize: 20,
                gameSpeed: 200,
                cols: Math.floor(canvas.width / 20),
                rows: Math.floor(canvas.height / 20),
                lastMoveTime: 0
            };

            // Ensure food doesn't spawn on snake
            function spawnFood() {
                let attempts = 0;
                do {
                    gameState.food = {
                        x: Math.floor(Math.random() * gameState.cols),
                        y: Math.floor(Math.random() * gameState.rows)
                    };
                    attempts++;
                } while (attempts < 100 && gameState.snake.some(segment =>
                    segment.x === gameState.food.x && segment.y === gameState.food.y));
            }

            spawnFood(); // Initial food spawn
            gamePreviewStates[gameId] = gameState;

            function drawSnakeGame() {
                if (!gameState.running) return;

                // Clear canvas with background
                ctx.fillStyle = '#1F2937';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw grid lines (subtle)
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= canvas.width; x += gameState.gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += gameState.gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                // Draw snake with gradient effect
                gameState.snake.forEach((segment, index) => {
                    const intensity = 1 - (index / gameState.snake.length) * 0.5;
                    ctx.fillStyle = index === 0 ? '#10B981' : `rgba(16, 185, 129, ${intensity})`;
                    ctx.fillRect(
                        segment.x * gameState.gridSize + 1,
                        segment.y * gameState.gridSize + 1,
                        gameState.gridSize - 2,
                        gameState.gridSize - 2
                    );

                    // Draw eyes on head
                    if (index === 0) {
                        ctx.fillStyle = '#FFFFFF';
                        const eyeSize = 3;
                        const eyeOffset = 4;
                        if (gameState.direction.x !== 0) {
                            ctx.fillRect(segment.x * gameState.gridSize + eyeOffset, segment.y * gameState.gridSize + 4, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gameState.gridSize + eyeOffset, segment.y * gameState.gridSize + 12, eyeSize, eyeSize);
                        } else {
                            ctx.fillRect(segment.x * gameState.gridSize + 4, segment.y * gameState.gridSize + eyeOffset, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gameState.gridSize + 12, segment.y * gameState.gridSize + eyeOffset, eyeSize, eyeSize);
                        }
                    }
                });

                // Draw food with pulsing effect
                const pulseSize = Math.sin(Date.now() * 0.01) * 2 + gameState.gridSize - 4;
                ctx.fillStyle = '#EF4444';
                ctx.fillRect(
                    gameState.food.x * gameState.gridSize + (gameState.gridSize - pulseSize) / 2,
                    gameState.food.y * gameState.gridSize + (gameState.gridSize - pulseSize) / 2,
                    pulseSize,
                    pulseSize
                );

                // Draw border
                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                // Show pause overlay
                if (gameState.paused) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'left';
                }
            }

            function updateSnakeGame() {
                if (!gameState.running) return;

                const currentTime = Date.now();
                if (currentTime - gameState.lastMoveTime < gameState.gameSpeed) {
                    drawSnakeGame();
                    gameState.animationId = requestAnimationFrame(updateSnakeGame);
                    return;
                }

                if (gameState.paused) {
                    drawSnakeGame();
                    gameState.animationId = requestAnimationFrame(updateSnakeGame);
                    return;
                }

                gameState.lastMoveTime = currentTime;

                // Update direction from buffer
                gameState.direction = { ...gameState.nextDirection };

                // Move snake
                const head = {
                    x: gameState.snake[0].x + gameState.direction.x,
                    y: gameState.snake[0].y + gameState.direction.y
                };

                // Check walls
                if (head.x < 0 || head.x >= gameState.cols ||
                    head.y < 0 || head.y >= gameState.rows) {
                    gameOver();
                    return;
                }

                // Check self collision
                if (gameState.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    gameOver();
                    return;
                }

                gameState.snake.unshift(head);

                // Check food collision
                if (head.x === gameState.food.x && head.y === gameState.food.y) {
                    gameState.score += 10;
                    if (scoreDisplay) {
                        scoreDisplay.textContent = `Score: ${gameState.score} | Length: ${gameState.snake.length}`;
                    }
                    spawnFood();

                    // Increase speed slightly
                    gameState.gameSpeed = Math.max(100, gameState.gameSpeed - 2);

                    playSound('score');
                } else {
                    gameState.snake.pop();
                }

                drawSnakeGame();
                gameState.animationId = requestAnimationFrame(updateSnakeGame);
            }

            function gameOver() {
                gameState.running = false;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText(`Final Score: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText(`Snake Length: ${gameState.snake.length}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.font = '14px Arial';
                ctx.fillText('Click Stop and Play again to restart', canvas.width / 2, canvas.height / 2 + 70);
                ctx.textAlign = 'left';
                playSound('gameOver');
            }

            // Enhanced keyboard handling with direction buffering
            window.currentGameKeyHandler = (e) => {
                if (!gameState.running) return;

                // Prevent default to stop page scrolling
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                }

                if (gameState.paused) return;

                const currentDir = gameState.direction;
                switch(e.key) {
                    case 'ArrowUp':
                        if (currentDir.y === 0) gameState.nextDirection = { x: 0, y: -1 };
                        break;
                    case 'ArrowDown':
                        if (currentDir.y === 0) gameState.nextDirection = { x: 0, y: 1 };
                        break;
                    case 'ArrowLeft':
                        if (currentDir.x === 0) gameState.nextDirection = { x: -1, y: 0 };
                        break;
                    case 'ArrowRight':
                        if (currentDir.x === 0) gameState.nextDirection = { x: 1, y: 0 };
                        break;
                }
                playSound('move');
            };

            document.addEventListener('keydown', window.currentGameKeyHandler);

            // Initialize score display
            if (scoreDisplay) {
                scoreDisplay.textContent = `Score: 0 | Length: 1`;
            }

            drawSnakeGame();
            updateSnakeGame();
        }

        // Enhanced Tetris Preview Game Implementation
        function initializeTetrisPreview(canvas, ctx, gameId, scoreDisplay) {
            const gameState = {
                running: true,
                paused: false,
                score: 0,
                lines: 0,
                level: 1,
                gridSize: 20,
                boardWidth: Math.floor(canvas.width / 20),
                boardHeight: Math.floor(canvas.height / 20),
                board: [],
                currentPiece: null,
                nextPiece: null,
                dropTime: 500,
                lastDropTime: 0,
                softDrop: false,
                clearingLines: [],
                clearingAnimation: 0
            };

            // Initialize board
            gameState.board = Array(gameState.boardHeight).fill().map(() => Array(gameState.boardWidth).fill(0));

            const pieces = [
                { shape: [[1,1,1,1]], color: '#00FFFF', name: 'I' }, // I-piece
                { shape: [[1,1],[1,1]], color: '#FFFF00', name: 'O' }, // O-piece
                { shape: [[0,1,0],[1,1,1]], color: '#800080', name: 'T' }, // T-piece
                { shape: [[0,1,1],[1,1,0]], color: '#00FF00', name: 'S' }, // S-piece
                { shape: [[1,1,0],[0,1,1]], color: '#FF0000', name: 'Z' }, // Z-piece
                { shape: [[1,0,0],[1,1,1]], color: '#FFA500', name: 'L' }, // L-piece
                { shape: [[0,0,1],[1,1,1]], color: '#0000FF', name: 'J' }  // J-piece
            ];

            gamePreviewStates[gameId] = gameState;

            // Tetris implementation
            function rotateMatrix(matrix, dir) {
                // transpose
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                    }
                }
                // reverse rows for clockwise, reverse whole array for counter-clockwise
                if (dir > 0) {
                    matrix.forEach(row => row.reverse());
                } else {
                    matrix.reverse();
                }
                return matrix;
            }

            function createPiece() {
                const template = pieces[Math.floor(Math.random() * pieces.length)];
                return {
                    shape: template.shape.map(r => r.slice()),
                    color: template.color,
                    name: template.name,
                    x: Math.floor(gameState.boardWidth / 2) - Math.ceil(template.shape[0].length / 2),
                    y: 0
                };
            }

            function validPosition(x, y, shape) {
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c]) {
                            const bx = x + c;
                            const by = y + r;
                            if (bx < 0 || bx >= gameState.boardWidth || by >= gameState.boardHeight) return false;
                            if (by >= 0 && gameState.board[by][bx]) return false;
                        }
                    }
                }
                return true;
            }

            function lockPiece() {
                const p = gameState.currentPiece;
                for (let r = 0; r < p.shape.length; r++) {
                    for (let c = 0; c < p.shape[r].length; c++) {
                        if (p.shape[r][c]) {
                            const bx = p.x + c;
                            const by = p.y + r;
                            if (by >= 0 && by < gameState.boardHeight && bx >= 0 && bx < gameState.boardWidth) {
                                gameState.board[by][bx] = p.color;
                            }
                        }
                    }
                }
                clearLines();
                gameState.currentPiece = gameState.nextPiece || createPiece();
                gameState.nextPiece = createPiece();
                // check spawn collision -> game over
                if (!validPosition(gameState.currentPiece.x, gameState.currentPiece.y, gameState.currentPiece.shape)) {
                    gameState.running = false;
                    showGameOver();
                }
            }

            function clearLines() {
                let cleared = 0;
                for (let r = gameState.boardHeight - 1; r >= 0; r--) {
                    if (gameState.board[r].every(cell => cell)) {
                        gameState.board.splice(r, 1);
                        gameState.board.unshift(Array(gameState.boardWidth).fill(0));
                        cleared++;
                        r++; // re-check same row index after splice
                    }
                }
                if (cleared > 0) {
                    gameState.lines += cleared;
                    const points = [0, 40, 100, 300, 1200];
                    gameState.score += (points[cleared] || 0) * gameState.level;
                    // level up every 10 lines
                    const newLevel = Math.floor(gameState.lines / 10) + 1;
                    if (newLevel > gameState.level) {
                        gameState.level = newLevel;
                        gameState.dropTime = Math.max(100, gameState.dropTime - 50);
                    }
                    showNotification(`${cleared} line${cleared>1?'s':''} cleared!`, 'success');
                }
            }

            function spawnPiece() {
                gameState.currentPiece = gameState.nextPiece || createPiece();
                gameState.nextPiece = createPiece();
            }

            function showGameOver() {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
                ctx.font = '16px Arial';
                ctx.fillText(`Score: ${gameState.score}`, canvas.width/2, canvas.height/2 + 20);
            }

            function drawTetris() {
                // background
                ctx.fillStyle = '#0b1220';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cellW = canvas.width / gameState.boardWidth;
                const cellH = canvas.height / gameState.boardHeight;

                // draw board grid and cells
                for (let r = 0; r < gameState.boardHeight; r++) {
                    for (let c = 0; c < gameState.boardWidth; c++) {
                        const cell = gameState.board[r][c];
                        if (cell) {
                            ctx.fillStyle = cell;
                            ctx.fillRect(c*cellW, r*cellH, cellW-1, cellH-1);
                        } else {
                            ctx.strokeStyle = '#111827';
                            ctx.strokeRect(c*cellW, r*cellH, cellW, cellH);
                        }
                    }
                }

                // draw current piece
                if (gameState.currentPiece) {
                    const p = gameState.currentPiece;
                    for (let r = 0; r < p.shape.length; r++) {
                        for (let c = 0; c < p.shape[r].length; c++) {
                            if (p.shape[r][c]) {
                                const bx = p.x + c;
                                const by = p.y + r;
                                if (by >= 0) {
                                    ctx.fillStyle = p.color;
                                    ctx.fillRect(bx*cellW, by*cellH, cellW-1, cellH-1);
                                }
                            }
                        }
                    }
                }

                // HUD
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`Score: ${gameState.score}`, 8, 16);
                ctx.fillText(`Lines: ${gameState.lines}`, 8, 32);
                ctx.fillText(`Level: ${gameState.level}`, 8, 48);
            }

            function hardDrop() {
                while (gameState.currentPiece && validPosition(gameState.currentPiece.x, gameState.currentPiece.y + 1, gameState.currentPiece.shape)) {
                    gameState.currentPiece.y += 1;
                    gameState.score += 2; // reward for hard drop
                }
                lockPiece();
            }

            // Input
            function tetrisKeyDown(e) {
                if (!gameState.running || gameState.paused) return;
                switch (e.key) {
                    case 'ArrowLeft':
                        if (validPosition(gameState.currentPiece.x - 1, gameState.currentPiece.y, gameState.currentPiece.shape)) {
                            gameState.currentPiece.x -= 1;
                        }
                        break;
                    case 'ArrowRight':
                        if (validPosition(gameState.currentPiece.x + 1, gameState.currentPiece.y, gameState.currentPiece.shape)) {
                            gameState.currentPiece.x += 1;
                        }
                        break;
                    case 'ArrowDown':
                        // soft drop
                        if (validPosition(gameState.currentPiece.x, gameState.currentPiece.y + 1, gameState.currentPiece.shape)) {
                            gameState.currentPiece.y += 1;
                            gameState.score += 1;
                        }
                        break;
                    case ' ': // space hard drop
                        e.preventDefault();
                        hardDrop();
                        break;
                    case 'ArrowUp': // rotate clockwise
                        const cloned = gameState.currentPiece.shape.map(r => r.slice());
                        rotateMatrix(cloned, 1);
                        if (validPosition(gameState.currentPiece.x, gameState.currentPiece.y, cloned)) {
                            gameState.currentPiece.shape = cloned;
                        } else {
                            // try wall kicks
                            if (validPosition(gameState.currentPiece.x - 1, gameState.currentPiece.y, cloned)) gameState.currentPiece.x -= 1;
                            else if (validPosition(gameState.currentPiece.x + 1, gameState.currentPiece.y, cloned)) gameState.currentPiece.x += 1;
                        }
                        break;
                    case 'z': // rotate counter-clockwise
                        const cloned2 = gameState.currentPiece.shape.map(r => r.slice());
                        rotateMatrix(cloned2, -1);
                        if (validPosition(gameState.currentPiece.x, gameState.currentPiece.y, cloned2)) {
                            gameState.currentPiece.shape = cloned2;
                        }
                        break;
                }
            }

            function tetrisKeyUp(e) {
                // reserved for future
            }

            // Game loop
            function tetrisUpdate(now) {
                if (!gameState.running) return;
                if (gameState.paused) {
                    drawTetris();
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
                    return gameState.animationId = requestAnimationFrame(tetrisUpdate);
                }

                if (!gameState.currentPiece) spawnPiece();

                if (!gameState.lastDropTime) gameState.lastDropTime = now;
                const elapsed = now - gameState.lastDropTime;
                const effectiveDrop = gameState.softDrop ? Math.max(30, gameState.dropTime/4) : gameState.dropTime;
                if (elapsed > effectiveDrop) {
                    gameState.lastDropTime = now;
                    if (validPosition(gameState.currentPiece.x, gameState.currentPiece.y + 1, gameState.currentPiece.shape)) {
                        gameState.currentPiece.y += 1;
                    } else {
                        // lock piece
                        lockPiece();
                    }
                }

                drawTetris();
                gameState.animationId = requestAnimationFrame(tetrisUpdate);
            }

            // initialization
            gameState.nextPiece = createPiece();
            spawnPiece();
            // attach input handlers (use window.currentGameKeyHandler pattern used elsewhere)
            window.currentGameKeyHandler = tetrisKeyDown;
            document.addEventListener('keydown', window.currentGameKeyHandler);
            const keyUpHandler = tetrisKeyUp;
            document.addEventListener('keyup', keyUpHandler);
            gameState.keyUpHandler = keyUpHandler;

            // start loop
            gameState.animationId = requestAnimationFrame(tetrisUpdate);

            // store state
            gamePreviewStates[gameId] = gameState;
        }

        // Minimal helper functions so page-level calls don't throw
        function playSound(type) {
            // Safe no-op sound helper
            try {
                // Could be enhanced to use WebAudio/Audio elements if assets are available
                // For now, keep silent to avoid network dependencies
            } catch (e) {
                console.warn('playSound failed:', e);
            }
        }

        function showNotification(message, type = 'info') {
            try {
                const id = 'gd-notify';
                let container = document.getElementById(id);
                if (!container) {
                    container = document.createElement('div');
                    container.id = id;
                    container.style.position = 'fixed';
                    container.style.top = '12px';
                    container.style.right = '12px';
                    container.style.zIndex = '2000';
                    document.body.appendChild(container);
                }
                const el = document.createElement('div');
                el.textContent = message;
                el.style.background = type === 'success' ? '#16a34a' : type === 'warning' ? '#f59e0b' : '#0ea5e9';
                el.style.color = '#fff';
                el.style.padding = '8px 12px';
                el.style.marginTop = '8px';
                el.style.borderRadius = '6px';
                el.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
                container.appendChild(el);
                setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 2200);
            } catch (e) {
                console.warn('showNotification failed:', e);
            }
        }

        function toggleGameSettings(gameId) {
            const el = document.getElementById(`gameSettings-${gameId}`);
            if (el) el.classList.toggle('hidden');
        }

        function initializeDefaultPreview(canvas, ctx, gameId, scoreDisplay) {
            ctx.fillStyle = '#0b1220';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Demo not implemented for this game type', canvas.width/2, canvas.height/2);
            gamePreviewStates[gameId] = { running: false };
        }

        // Simple stubs for unimplemented types
        function initializeChessPreview() { initializeDefaultPreview(...arguments); }
        function initializePacmanPreview() { initializeDefaultPreview(...arguments); }

    </script>
