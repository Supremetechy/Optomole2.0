<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Optomole · Playable Runtime</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #030712; color: #e5f4ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #game { position: fixed; inset: 0;
      background: radial-gradient(circle at 28% 18%, rgba(103,232,249,.16), transparent 34%),
                  radial-gradient(circle at 80% 12%, rgba(52,211,153,.12), transparent 32%), #030712; }
    #game canvas { display: block; width: 100%; height: 100%; }
    #boot-loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #030712;
      transition: opacity .3s ease, visibility .3s ease; }
    body.ready #boot-loading { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader { width: min(320px, calc(100vw - 48px)); border: 1px solid rgba(103,232,249,.24); border-radius: 10px;
      background: rgba(5,12,24,.92); padding: 20px; box-shadow: 0 20px 80px rgba(0,0,0,.5); }
    .loader .k { margin: 0; color: #67e8f9; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .loader h1 { margin: 8px 0 0; font-size: 20px; }
    .loader .m { margin: 6px 0 0; color: #94a3b8; font-size: 13px; }
    .bar { height: 6px; margin-top: 16px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
    .bar:before { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #67e8f9, #34d399); animation: lb 1.1s ease-in-out infinite; }
    @keyframes lb { 0% { transform: translateX(-100%);} 100% { transform: translateX(240%);} }
    #boot-error { display: none; position: fixed; inset: 0; z-index: 60; place-items: center; background: rgba(3,7,18,.96); padding: 24px; }
    #boot-error .box { max-width: 440px; border: 1px solid rgba(251,113,133,.4); border-radius: 10px; background: #0b1220; padding: 20px; }
    #boot-error h2 { margin: 0 0 8px; color: #fb7185; font-size: 16px; }
    #boot-error p { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; word-break: break-word; }
    @media (prefers-reduced-motion: reduce) { .bar:before { animation: none; } }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="boot-loading">
    <div class="loader">
      <p class="k">Optomole Browser Engine</p>
      <h1>Loading Playable Runtime</h1>
      <p class="m">Compiling content into a game…</p>
      <div class="bar"></div>
    </div>
  </div>

  <div id="boot-error">
    <div class="box">
      <h2>Runtime failed to start</h2>
      <p>—</p>
    </div>
  </div>

  <!-- Runtime libraries (UMD globals: PIXI, Matter, Howl) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

  <script type="module" src="./boot.js"></script>
</body>
</html>
